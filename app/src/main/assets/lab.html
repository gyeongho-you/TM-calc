<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연구실</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--card2:#f7f7fa;--fg:#1d2026;--mut:#6b7079;--line:#e1e4e8;--acc:#6d4fc2;--acc-fg:#fff;--acc-bg:#efeafd;--good:#1f8a4c;--bad:#c2410c;--in:#fff;--hl:#fff7d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222429;--card2:#2a2c32;--fg:#e8e9ec;--mut:#9a9da3;--line:#363940;--acc:#b39ddb;--acc-fg:#17181b;--acc-bg:#2f2a3d;--good:#5fd08f;--bad:#ff9a6a;--in:#1b1c20;--hl:#3a3420}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222429;--card2:#2a2c32;--fg:#e8e9ec;--mut:#9a9da3;--line:#363940;--acc:#b39ddb;--acc-fg:#17181b;--acc-bg:#2f2a3d;--good:#5fd08f;--bad:#ff9a6a;--in:#1b1c20;--hl:#3a3420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px}
header h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:8px 16px 80px}
h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.big{font-size:16px;font-weight:600}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:600}
button.sm{padding:4px 10px;font-size:13px}
button.danger{color:var(--bad)}
button.ghost{background:none;border:none;padding:6px 8px}
input,select{font:inherit;font-size:15px;background:var(--in);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
label.f input,label.f select{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acc);color:var(--acc-fg);margin-left:6px;vertical-align:middle;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acc-bg);color:var(--acc);margin:2px 4px 2px 0}
.tag.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border-radius:16px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600}
td.l,th.l{text-align:left}
tr.worst td{background:var(--hl)}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:14px;word-break:break-all;margin:8px 0;padding:10px;background:var(--card2);border-radius:10px}
.model.best{border-color:var(--acc);background:var(--acc-bg)}
.good{color:var(--good)}.bad{color:var(--bad)}
ul.hints{margin:6px 0;padding-left:20px}
ul.hints li{margin:4px 0}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:6px}
.list-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.list-row input[type=text]{flex:1}
.empty{text-align:center;padding:24px 12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:8px 12px}
.seg button.on{background:var(--acc);color:var(--acc-fg)}
</style>
</head>
<body>
<header><button class="ghost" id="back" style="display:none">←</button><h1 id="title">연구실</h1><span id="hdr"></span></header>
<main id="view"></main>
<input id="file" type="file" accept=".json,application/json" style="display:none">

<script id="core">

// ---------------------------------------------------------------- 숫자
/** "3억5952만", "191만9961", "16.6만", "+44.38%", "1,234" → 숫자 */
function num(s){
  if(s==null) return NaN
  s=String(s).replace(/[\s,]/g,'').replace(/%$/,'')
  if(s==='') return NaN
  let neg=false
  if(s[0]==='+') s=s.slice(1); else if(s[0]==='-'){neg=true;s=s.slice(1)}
  let t=0
  for(const [u,m] of [['억',1e8],['만',1e4]]){
    const i=s.indexOf(u)
    if(i>=0){const a=s.slice(0,i);const v=a===''?1:Number(a);if(!isFinite(v))return NaN;t+=v*m;s=s.slice(i+1)}
  }
  if(s!==''){const v=Number(s);if(!isFinite(v))return NaN;t+=v}
  return neg?-t:t
}
function fmt(v,d){
  if(!isFinite(v)) return '-'
  if(d!=null) return v.toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:0})
  const a=Math.abs(v)
  if(a>=1e6) return Math.round(v).toLocaleString('ko-KR')
  if(Math.abs(v-Math.round(v))<1e-9*Math.max(1,a)) return Math.round(v).toLocaleString('ko-KR')
  return Number(v.toPrecision(6)).toLocaleString('ko-KR',{maximumFractionDigits:6})
}
/** 계수 표시: 1.000002 → 1 처럼 깔끔한 값에 가까우면 그 값으로 */
function coef(v){
  for(const d of [0,1,2,3]){const r=Math.round(v*10**d)/10**d;if(Math.abs(v-r)<=Math.max(1e-6,Math.abs(v)*2e-5))return String(r)}
  return String(Number(v.toPrecision(6)))
}

// ---------------------------------------------------------------- 선형대수
function solve(A,b){
  const n=b.length,M=A.map((r,i)=>[...r,b[i]])
  for(let c=0;c<n;c++){
    let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r
    if(Math.abs(M[p][c])<1e-300)return null
    ;[M[c],M[p]]=[M[p],M[c]]
    for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c]/M[c][c];if(f)for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}
  }
  return M.map((r,i)=>r[n]/r[i])
}
/** 최소제곱 y ≈ c + Σ a_i x_i (열마다 크기를 맞춰서 풀어 큰 숫자도 안정적) */
function ols(X,y){
  const n=y.length,m=X[0]?X[0].length:0
  const sc=[...Array(m)].map((_,j)=>Math.max(1e-12,...X.map(r=>Math.abs(r[j]))))
  const D=X.map(r=>[1,...r.map((v,j)=>v/sc[j])])
  const k=m+1,A=[...Array(k)].map(()=>Array(k).fill(0)),b=Array(k).fill(0)
  for(let i=0;i<n;i++)for(let p=0;p<k;p++){b[p]+=D[i][p]*y[i];for(let q=0;q<k;q++)A[p][q]+=D[i][p]*D[i][q]}
  for(let p=0;p<k;p++)A[p][p]+=1e-10*(A[p][p]+1)
  const s=solve(A,b);if(!s)return null
  return [s[0],...s.slice(1).map((v,j)=>v/sc[j])]
}
/** Levenberg–Marquardt: 잔차 제곱합이 가장 작은 p */
function lm(f,p0,X,y,iters=400){
  let p=p0.slice(),lam=1e-3
  const R=q=>X.map((x,i)=>f(q,x)-y[i])
  const S=r=>r.reduce((s,v)=>s+v*v,0)
  let r=R(p),sse=S(r)
  if(!isFinite(sse))return{p,sse:Infinity}
  for(let it=0;it<iters;it++){
    const k=p.length,J=X.map(()=>Array(k))
    for(let j=0;j<k;j++){
      const h=1e-7*(Math.abs(p[j])+1e-4),q=p.slice();q[j]+=h
      for(let i=0;i<X.length;i++)J[i][j]=(f(q,X[i])-y[i]-r[i])/h
    }
    const A=[...Array(k)].map(()=>Array(k).fill(0)),g=Array(k).fill(0)
    for(let i=0;i<X.length;i++)for(let a=0;a<k;a++){g[a]+=J[i][a]*r[i];for(let b=0;b<k;b++)A[a][b]+=J[i][a]*J[i][b]}
    let improved=false
    for(let t=0;t<12;t++){
      const B=A.map((row,a)=>row.map((v,b)=>a===b?v*(1+lam)+1e-12:v))
      const d=solve(B,g.map(v=>-v))
      if(d){
        const q=p.map((v,j)=>v+d[j]),rq=R(q),sq=S(rq)
        if(isFinite(sq)&&sq<sse){
          const rel=(sse-sq)/(sse||1);p=q;r=rq;sse=sq;lam=Math.max(lam/3,1e-12);improved=true
          if(rel<1e-13)return{p,sse}
          break
        }
      }
      lam*=4
    }
    if(!improved)break
  }
  return{p,sse}
}

// ---------------------------------------------------------------- 공식 후보
/**
 * vars: [{id,name,cat,unit:'flat'|'pct',reduce:bool}], X: 행마다 vars 순서의 값, y: 결과
 * 반환: 후보마다 {name,desc,k,predict(x),formula,sse,...} (잘 맞는 순)
 */
/**
 * 공식 모양(spec) → 계산 함수 f(p, x). 찾은 공식을 저장했다가 최적화에서 다시 계산할 때 쓴다.
 * x 는 변수 값 배열, p 는 계수 배열.
 */
function makeF(sp){
  const sum=(idx,p,o,x,div=1)=>idx.reduce((s,i,j)=>s+p[o+j]*x[i]/div,0)
  switch(sp.type){
    case'lin':return(p,x)=>p[0]+x.reduce((s,v,i)=>s+p[i+1]*v,0)
    case'mul':return(p,x)=>(p[0]+sum(sp.F,p,1,x))*(1+sum(sp.P,p,1+sp.F.length,x,100))
    case'grp':return(p,x)=>{let m=p[0]+sum(sp.F,p,1,x),o=1+sp.F.length;for(const g of sp.g){m*=1+sum(g,p,o,x,100);o+=g.length}return m}
    case'pow':return(p,x)=>Math.exp(p[0]+x.reduce((s,v,i)=>s+p[i+1]*Math.log(v),0))
    case'red':return(p,x)=>{const K=p[p.length-1];return(p[0]+sum(sp.O,p,1,x))*K/(K+x[sp.d])}
    case'red6':return(p,x)=>{const K=p[p.length-1];return(p[0]+sum(sp.Fo,p,1,x))*(1+sum(sp.P,p,1+sp.Fo.length,x,100))*K/(K+x[sp.d])}
    case'gp':{const fn=new Function('c','x',`return c[${sp.k}]+c[${sp.k+1}]*${sp.body}`);return fn}
  }
  return null
}
function fitModels(vars,X,y,tol){
  const n=y.length,out=[]
  const idx=f=>vars.map((v,i)=>f(v)?i:-1).filter(i=>i>=0)
  const N=i=>vars[i].name
  const lin=ols(X,y)
  const term=(a,i)=>(a<0?' − ':' + ')+coef(Math.abs(a))+'×'+N(i)
  const add=(name,desc,f,p,form,snap=true,spec=null)=>{
    const k=p.length
    if(n<=k)return out.push({name,desc,k,skip:`기록이 ${k+1}개 이상 필요 (지금 ${n}개)`})
    const pr=X.map(x=>f(p,x)),res=pr.map((v,i)=>v-y[i])
    if(res.some(v=>!isFinite(v)))return
    const sse=res.reduce((s,v)=>s+v*v,0)
    const m={name,desc,k,f,p,form,snap,spec,formula:pretty(form(p)),pr,res,sse};m.predict=x=>m.f(m.p,x)
    out.push(m)
  }
  const pc=i=>vars[i].name.includes('%')?'':'%'
  // 1) 합
  if(lin) add('합 (선형)','결과 = 상수 + 각 변수 × 계수',makeF({type:'lin'}),lin,
    p=>'결과 = '+coef(p[0])+vars.map((_,i)=>term(p[i+1],i)).join(''),true,{type:'lin'})
  const F=idx(v=>v.unit!=='pct'),P=idx(v=>v.unit==='pct'),D=idx(v=>v.reduce)
  const meanY=y.reduce((s,v)=>s+v,0)/n||1
  // 2) (고정 합) × (1 + % 합)
  if(P.length&&lin){
    const sp2={type:'mul',F,P},f=makeF(sp2)
    const p0=[lin[0],...F.map(i=>lin[i+1]),...P.map(i=>lin[i+1]*100/meanY)]
    const {p}=lm(f,p0,X,y)
    add('고정 합 × (1 + % 합)','고정값끼리 더한 뒤, %끼리 더한 배율을 한 번 곱함',f,p,
      p=>'결과 = ('+coef(p[0])+F.map((i,j)=>term(p[1+j],i)).join('')+') × (1'+P.map((i,j)=>term(p[1+F.length+j],i)+pc(i)).join('')+')',true,sp2)
    // 3) %를 묶어서 곱: 분류별 / 항목별 / 하나하나 (같은 묶음 안의 %는 더함)
    const seen=new Set([JSON.stringify([P])])
    for(const [mname,mdesc,key] of [
      ['분류별 곱','같은 분류(룬, 스킬 …)의 %는 더하고, 분류끼리는 곱함',i=>vars[i].cat||'(분류 없음)'],
      ['항목별 곱','같은 항목(공격력, 데미지 …)의 %는 분류가 달라도 더하고, 항목끼리는 곱함',i=>vars[i].item||vars[i].name],
      ['% 하나하나 곱','모든 %를 각각 따로 곱함',i=>vars[i].name]]){
      const keys=[...new Set(P.map(key))]
      if(keys.length<2)continue
      const g=keys.map(k=>P.filter(i=>key(i)===k))
      const sig=JSON.stringify(g);if(seen.has(sig))continue;seen.add(sig)
      const sp3={type:'grp',F,g},f3=makeF(sp3)
      const q0=[p[0],...F.map((_,j)=>p[1+j]),...g.flat().map(i=>p[1+F.length+P.indexOf(i)])]
      const r3=lm(f3,q0,X,y)
      add(mname,mdesc,f3,r3.p,q=>{
        let o=1+F.length
        const parts=g.map(grp=>{const s='(1'+grp.map((i,j)=>term(q[o+j],i)+pc(i)).join('')+')';o+=grp.length;return s})
        return '결과 = ('+coef(q[0])+F.map((i,j)=>term(q[1+j],i)).join('')+') × '+parts.join(' × ')},true,sp3)
    }
  }
  // 4) 거듭제곱 (모두 곱): 값이 모두 양수일 때
  if(vars.length&&y.every(v=>v>0)&&X.every(r=>r.every(v=>v>0))){
    const l=ols(X.map(r=>r.map(Math.log)),y.map(Math.log))
    if(l){
      const f=makeF({type:'pow'})
      const {p}=lm(f,l,X,y)
      add('거듭제곱 (모두 곱)','결과 = 상수 × 변수1^a × 변수2^b …',f,p,
        p=>'결과 = '+coef(Math.exp(p[0]))+vars.map((_,i)=>' × '+N(i)+'^'+coef(p[i+1])).join(''),false,{type:'pow'})
    }
  }
  // 5) 감소형: (나머지) × K / (K + 방어)
  for(const d of D){
    const O=vars.map((_,i)=>i).filter(i=>i!==d)
    const lo=ols(X.map(r=>O.map(i=>r[i])),y);if(!lo)continue
    const md=X.reduce((s,r)=>s+Math.abs(r[d]),0)/n||1,mx=Math.max(...X.map(r=>Math.abs(r[d])))
    // K>0: 값이 클수록 줄어듦 (적 방어) / K<0: 값이 클수록 늘어남 (방깎: K/(K−x) 꼴)
    const Ks=[md*0.3,md,md*3,md*10,-(mx*1.5+md),-(mx*3+md*3),-(mx*10+md*10)]
    const sp5={type:'red',O,d},f=makeF(sp5)
    let best=null
    for(const K of Ks){
      const r=lm(f,[...lo.map(v=>v*(K+md)/K),K],X,y)
      if(!best||r.sse<best.sse)best=r
    }
    add(`감소형 (${N(d)})`,`결과 = (나머지 합) × K / (K + ${N(d)})  · K 가 음수면 깎을수록 늘어나는 방깎 꼴`,f,best.p,p=>{const K=p[p.length-1]
      return '결과 = ('+coef(p[0])+O.map((i,j)=>term(p[1+j],i)).join('')+`) × ${coef(K)} / (${coef(K)} + ${N(d)})`},true,sp5)
    // 6) % 배율까지 있는 감소형
    const Fo=F.filter(i=>i!==d)
    if(P.length){
      const sp6={type:'red6',Fo,P,d},f6=makeF(sp6)
      let b6=null
      for(const K of Ks){
        const r=lm(f6,[lo[0]*(K+md)/K,...Fo.map(i=>lo[1+O.indexOf(i)]*(K+md)/K),...P.map(()=>0),K],X,y)
        if(!b6||r.sse<b6.sse)b6=r
      }
      add(`고정 합 × (1 + % 합) × 감소 (${N(d)})`,'%배율과 방어 감소를 모두 곱함',f6,b6.p,q=>{const K6=q[q.length-1]
        return '결과 = ('+coef(q[0])+Fo.map((i,j)=>term(q[1+j],i)).join('')+') × (1'+P.map((i,j)=>term(q[1+Fo.length+j],i)+pc(i)).join('')+`) × ${coef(K6)} / (${coef(K6)} + ${N(d)})`},true,sp6)
    }
  }
  // 점수: AICc (오차가 작고 계수가 적을수록 좋음)
  const ss=y.reduce((s,v)=>s+(v-meanY)**2,0)
  const unit=roundUnit(y)
  for(const m of out){
    if(m.skip)continue
    const floor=n*(unit*unit/12)*1e-3+1e-12
    m.rmse=Math.sqrt(m.sse/n)
    m.maxAbs=Math.max(...m.res.map(Math.abs))
    m.maxRel=Math.max(...m.res.map((v,i)=>Math.abs(v)/(Math.abs(y[i])||1)))
    m.r2=ss>0?1-m.sse/ss:NaN
    m.exact=within(m.res,unit,tol)
    m.score=n*Math.log(Math.max(m.sse,floor)/n)+2*m.k+(n-m.k-1>0?2*m.k*(m.k+1)/(n-m.k-1):1e6)
    if(m.exact&&m.snap)tidy(m,X,y,unit,tol)
  }
  out.sort((a,b)=>(a.skip?1:0)-(b.skip?1:0)||(b.exact-a.exact)||(a.exact&&b.exact?a.k-b.k:0)||a.score-b.score)
  return out
}
/**
 * 반올림 안에서 딱 맞는 공식이면 계수를 깔끔한 값(0, 1, 0.5 …)으로 바꿔 본다.
 * 하나씩 바꾸고 나머지를 다시 맞춰서, 여전히 모든 기록이 반올림 안에 들면 그 값으로 둔다.
 */
/** 모든 기록이 허용 오차 안인가 (tol[i] 가 있으면 기록마다, 없으면 반올림 단위) */
function within(res,unit,tol){return res.every((r,i)=>Math.abs(r)<=Math.max(unit,tol&&tol[i]||0)*1.0000001+1e-9)}
function tidy(m,X,y,unit,tol){
  const fits=q=>within(X.map((x,i)=>m.f(q,x)-y[i]),unit,tol)
  let p=m.p.slice(),fixed=new Set()
  // 단순한 숫자부터 (0 → 1000 → 1200 → 998 …): 유효숫자가 적은 순, 같으면 가까운 순
  const sig=c=>c===0?0:String(Math.abs(c)).replace('.','').replace(/^0+/,'').replace(/0+$/,'').length
  const cands=v=>{const c=[0];for(const d of [0,1,2,3])c.push(Math.round(v*10**d)/10**d)
    for(const s of [1,2,3,4])c.push(Number(v.toPrecision(s)))
    return[...new Set(c)].filter(c=>Math.abs(c-v)<=Math.max(Math.abs(v)*0.02,0.5)).sort((a,b)=>sig(a)-sig(b)||Math.abs(a-v)-Math.abs(b-v))}
  for(let j=0;j<p.length;j++){
    for(const c of cands(p[j])){
      const q=p.slice();q[j]=c
      // 아직 안 정한 계수들만 다시 맞춘다
      const free=[...Array(p.length).keys()].filter(i=>i!==j&&!fixed.has(i))
      const g=(r,x)=>{const z=q.slice();free.forEach((i,t)=>z[i]=r[t]);return m.f(z,x)}
      const r=free.length?lm(g,free.map(i=>q[i]),X,y,100).p:[]
      free.forEach((i,t)=>q[i]=r[t])
      if(fits(q)){p=q;fixed.add(j);break}
    }
  }
  if(fixed.size){
    m.tidy=pretty(m.form(p));m.tidyP=p
    // 깔끔하게 정리된 값으로 예측 (최적화에도 이걸 씀)
    m.p=p;m.predict=x=>m.f(p,x);m.pr=X.map(x=>m.f(p,x));m.res=m.pr.map((v,i)=>v-y[i])
    m.maxAbs=Math.max(...m.res.map(Math.abs));m.maxRel=Math.max(...m.res.map((v,i)=>Math.abs(v)/(Math.abs(y[i])||1)))
  }
}
/** 보기 좋게: "0 + ", "1×", "+ 0×변수" 를 뺀다 */
function pretty(t){
  return t.replace(/ [+−] 0×[^ ()]+/g,'').replace(/\(0 [+] /g,'(').replace(/= 0 [+] /g,'= ').replace(/\(0 − /g,'(−').replace(/= 0 − /g,'= −')
    .replace(/(^|[^\d.])1×/g,'$1').replace(/\+ -(\d)/g,'− $1').replace(/− -(\d)/g,'+ $1').replace(/= \((-?[\d.]+)\) ×/g,'= $1 ×').replace(/× -([\d.]+) \/ \(-\1 \+ ([^()]+)\)/g,'× $1 / ($1 − $2)').replace(/\+ -(\d)/g,'− $1')
}
/** 결과값이 몇 단위로 반올림돼 보이는지 (정수면 1, 소수 둘째 자리면 0.01) */
function roundUnit(y){
  let d=0
  for(const v of y){const s=String(v);const i=s.indexOf('.');if(i>=0)d=Math.max(d,s.length-i-1)}
  return 10**-Math.min(d,6)
}
/** 다음에 뭘 찍어야 할지 */
function hints(vars,X,y,models){
  const H=[],n=y.length
  vars.forEach((v,i)=>{const s=new Set(X.map(r=>r[i]))
    if(s.size<2)H.push(`'${v.name}'은(는) 한 번도 안 바뀌었어요. 이것만 바꿔서 2개 이상 기록하면 효과를 알 수 있어요.`)
    else if(s.size<3)H.push(`'${v.name}'은(는) 값이 2가지뿐이라 비례하는지 휘는지 알 수 없어요. 다른 크기로도 바꿔 보세요 (예: +3%, +4%, +10%).`)})
  const pv=vars.filter(v=>v.unit==='pct'&&v.stack!=null)
  if(pv.length&&pv.every(v=>v.stack<2))H.push('합연산인지 곱연산인지 가리려면 같은 항목을 두 번 이상 쌓은 기록이 필요해요 (예: +5% 인 상태에서 +5% 더).')
  for(let a=0;a<vars.length;a++)for(let b=a+1;b<vars.length;b++){
    const r=corr(X.map(x=>x[a]),X.map(x=>x[b]))
    if(Math.abs(r)>0.98)H.push(`'${vars[a].name}'와(과) '${vars[b].name}'이(가) 항상 같이 바뀌어서 구분이 안 돼요. 둘 중 하나만 바꾼 기록이 필요해요.`)
  }
  const ok=models.filter(m=>!m.skip)
  const k=ok[0]?ok[0].k:vars.length+1
  if(n<2*k)H.push(`기록이 ${n}개예요. 후보끼리 확실히 가르려면 ${2*k}개 이상이 좋아요.`)
  if(ok.length>1&&n>0){
    const A=ok[0],B=ok[1]
    if(!(A.exact&&!B.exact)&&(B.score-A.score)<4){
      const last=X[n-1];let best=null
      vars.forEach((v,i)=>{
        const col=X.map(r=>r[i]),span=Math.max(...col)-Math.min(...col)
        const step=span>0?span:(Math.abs(last[i])*0.5||10)
        for(const s of [step,-step]){
          const x=last.slice();x[i]+=s
          const pa=A.predict(x),pb=B.predict(x),d=Math.abs(pa-pb)/(Math.abs(pa)||1)
          if(isFinite(d)&&(!best||d>best.d))best={i,s,d,x:x[i]}
        }
      })
      if(best&&best.d>1e-4)H.push(`'${A.name}'와(과) '${B.name}'이(가) 비슷하게 맞아요. '${vars[best.i].name}'을(를) ${fmt(best.x)} 근처로 바꿔서 기록하면 둘의 예측이 ${fmt(best.d*100,1)}% 차이 나서 갈려요.`)
    }
  }
  const top=ok[0]
  if(top&&!top.exact&&top.maxRel>0.01)H.push(`가장 잘 맞는 공식도 오차가 최대 ${fmt(top.maxRel*100,2)}%예요. 빠진 변수가 있거나, 입력 실수(표에서 노랗게 표시)일 수 있어요.`)
  return H
}
function corr(a,b){
  const n=a.length;if(n<3)return 0
  const ma=a.reduce((s,v)=>s+v,0)/n,mb=b.reduce((s,v)=>s+v,0)/n
  let sab=0,saa=0,sbb=0
  for(let i=0;i<n;i++){sab+=(a[i]-ma)*(b[i]-mb);saa+=(a[i]-ma)**2;sbb+=(b[i]-mb)**2}
  return saa&&sbb?sab/Math.sqrt(saa*sbb):0
}
/** "룬공격 +85000; 치명피해 -5, 공격력 =300" → [{name,op,val}] */
function parseChanges(s){
  return String(s||'').split(/[;\n,]+/).map(t=>t.trim()).filter(Boolean).map(t=>{
    const m=t.match(/^(.+?)\s*([+\-=])\s*([^+\-=]+)$/);if(!m)return null
    return{name:m[1].replace(/\s/g,''),op:m[2],val:num(m[3])}
  }).filter(Boolean)
}

// ---------------------------------------------------------------- 심도 탐색 (기호 회귀)
// 공식 모양을 나무(트리)로 만들고, 섞고 바꿔 가며(유전 프로그래밍) 기록에 가장 잘 맞고 단순한 것을 찾는다.
// 상수는 후보마다 기록에 맞게 다시 계산한다. 결과 = α + β × (나무) 로 감싸서 크기·단위는 따로 맞춘다.
const GP_BIN=['+','-','*','/','+','*','max']
const gpPick=a=>a[Math.floor(Math.random()*a.length)]
function gpLeaf(nv){return Math.random()<0.75?{o:'v',i:Math.floor(Math.random()*nv)}:{o:'c',v:gpPick([1,2,0.5,10,100,1000])}}
function gpRand(nv,d){
  if(d<=0||Math.random()<0.3)return gpLeaf(nv)
  if(Math.random()<0.12)return{o:'pct',a:gpRand(nv,d-1)}
  return{o:gpPick(GP_BIN),a:gpRand(nv,d-1),b:gpRand(nv,d-1)}
}
function gpSize(n){return n.o==='v'||n.o==='c'?1:1+gpSize(n.a)+(n.b?gpSize(n.b):0)}
const gpClone=n=>JSON.parse(JSON.stringify(n))
function gpNodes(n,out=[],par=null,key=null){out.push({n,par,key});if(n.a)gpNodes(n.a,out,n,'a');if(n.b)gpNodes(n.b,out,n,'b');return out}
function gpReplace(root,ref,sub){if(!ref.par)return sub;ref.par[ref.key]=sub;return root}
function gpJs(n,cs){
  switch(n.o){
    case'v':return`x[${n.i}]`
    case'c':cs.push(n.v);return`c[${cs.length-1}]`
    case'pct':return`(1+${gpJs(n.a,cs)}/100)`
    case'max':{const a=gpJs(n.a,cs);return`Math.max(${a},${gpJs(n.b,cs)})`}
    default:{const a=gpJs(n.a,cs);return`(${a}${n.o}${gpJs(n.b,cs)})`}
  }
}
function gpSetConsts(n,p,st={k:0}){if(n.o==='c')n.v=p[st.k++];if(n.a)gpSetConsts(n.a,p,st);if(n.b)gpSetConsts(n.b,p,st);return n}
/** 보기 좋은 글자 (상수는 p 에서 앞에서부터 꺼내 씀) */
function gpStr(n,names,cs,prec=0){
  switch(n.o){
    case'v':return names[n.i]
    case'c':return coef(cs.shift())
    case'pct':return'(1 + '+(n.a.o==='v'?names[n.a.i]+(names[n.a.i].includes('%')?'':'%'):'('+gpStr(n.a,names,cs)+')/100')+')'
    case'max':{const a=gpStr(n.a,names,cs);return'max('+a+', '+gpStr(n.b,names,cs)+')'}
    default:{
      const P={'+':1,'-':1,'*':2,'/':2}[n.o]
      const a=gpStr(n.a,names,cs,P),b=gpStr(n.b,names,cs,P+(n.o==='-'||n.o==='/'?1:0))
      const s=a+{'+':' + ','-':' − ','*':' × ','/':' / '}[n.o]+b
      return P<prec?'('+s+')':s
    }
  }
}
function gpCompile(tree){
  const cs=[],body=gpJs(tree,cs),k=cs.length
  let fn;try{fn=new Function('c','x',`return c[${k}]+c[${k+1}]*${body}`)}catch(e){return null}
  return{fn,cs,k,body}
}
/** 나무 하나의 상수를 맞추고 오차 계산. 같은 모양은 한 번만 */
function gpEval(tree,X,y,cache,sd){
  const C=gpCompile(tree);if(!C)return null
  if(cache.has(C.body))return cache.get(C.body)
  const {fn,cs,k}=C
  const t=X.map(x=>fn([...cs,0,1],x))
  if(t.some(v=>!isFinite(v))||Math.max(...t)-Math.min(...t)<1e-12){cache.set(C.body,null);return null}
  const l=ols(t.map(v=>[v]),y)
  const r=lm(fn,[...cs,l?l[0]:0,l?l[1]:1],X,y,k?25:4)
  if(!isFinite(r.sse)){cache.set(C.body,null);return null}
  const e={tree:gpSetConsts(gpClone(tree),r.p),p:r.p,fn,k,size:gpSize(tree),sse:r.sse,errN:Math.sqrt(r.sse/y.length)/sd}
  cache.set(C.body,e)
  return e
}
function gpMutate(t,nv){
  t=gpClone(t)
  const ref=gpPick(gpNodes(t)),n=ref.n,r=Math.random()
  if(r<0.25)return gpReplace(t,ref,gpRand(nv,2))
  if(r<0.45){
    if(n.o==='v')n.i=Math.floor(Math.random()*nv)
    else if(n.o==='c')n.v*=0.5+Math.random()
    else if(n.b)n.o=gpPick(GP_BIN)
    return t
  }
  if(r<0.55){
    // 비율 감소: x × m/(m + v)  (방어 감소에 흔한 모양)
    const v={o:'v',i:Math.floor(Math.random()*nv)},m=Math.random()<0.5?gpClone(n):{o:'c',v:gpPick([100,1000])}
    return gpReplace(t,ref,{o:'*',a:n,b:{o:'/',a:m,b:{o:'+',a:gpClone(m),b:v}}})
  }
  if(r<0.8){
    const leaf=Math.random()<0.5?{o:'v',i:Math.floor(Math.random()*nv)}:{o:'*',a:{o:'c',v:1},b:{o:'v',i:Math.floor(Math.random()*nv)}}
    const o=gpPick(['+','*','-','/','+','*'])
    const w=Math.random()<0.15?{o:'pct',a:n}:Math.random()<0.6?{o,a:n,b:leaf}:{o,a:leaf,b:n}
    return gpReplace(t,ref,w)
  }
  if(n.a)return gpReplace(t,ref,!n.b||Math.random()<0.5?n.a:n.b)
  return gpReplace(t,ref,gpLeaf(nv))
}
function gpCross(a,b){a=gpClone(a);return gpReplace(a,gpPick(gpNodes(a)),gpClone(gpPick(gpNodes(b)).n))}
/** 빠른 탐색의 틀들을 시작점으로 넣는다 (심도 탐색이 빠른 탐색보다 못하지 않게) */
function gpSeeds(vars){
  const V=i=>({o:'v',i}),sum=ids=>ids.map(V).reduce((a,b)=>({o:'+',a,b}))
  const wsum=ids=>ids.map(i=>({o:'*',a:{o:'c',v:1},b:V(i)})).reduce((a,b)=>({o:'+',a,b}))
  const all=vars.map((_,i)=>i),F=all.filter(i=>vars[i].unit!=='pct'&&!vars[i].reduce),P=all.filter(i=>vars[i].unit==='pct'),D=all.filter(i=>vars[i].reduce)
  const S=[]
  if(!all.length)return S
  S.push(sum(all),wsum(all),all.map(V).reduce((a,b)=>({o:'*',a,b})))
  const base=F.length?sum(F):{o:'c',v:1},wbase=F.length?wsum(F):{o:'c',v:1}
  // 기본값 + 변화량 (세션 기록은 변화량만 적으므로 시작값이 상수로 붙는 경우가 많다)
  const cbase=F.length?{o:'+',a:{o:'c',v:100},b:sum(F)}:{o:'c',v:1}
  if(F.length)S.push(cbase)
  if(P.length){
    for(const b of [base,wbase,cbase]){
      S.push({o:'*',a:b,b:{o:'pct',a:sum(P)}})
      S.push(P.reduce((t,i)=>({o:'*',a:t,b:{o:'pct',a:V(i)}}),b))
    }
  }
  for(const d of D){
    const red=x=>({o:'*',a:x,b:{o:'/',a:{o:'c',v:1000},b:{o:'+',a:{o:'c',v:1000},b:V(d)}}})
    S.push(red(base),red(wbase),red(cbase),{o:'-',a:base,b:V(d)})
    if(P.length)S.push(red({o:'*',a:base,b:{o:'pct',a:sum(P)}}))
  }
  return S
}
/** 조금씩 나눠 돌리는 탐색기: step(ms) 를 여러 번 부르면 된다 (화면이 멈추지 않게) */
function gpEngine(vars,X,y,opt={}){
  const nv=vars.length,cache=new Map(),N=opt.pop||160,MAX=opt.maxSize||25
  const n=y.length,mean=y.reduce((s,v)=>s+v,0)/n,sd=Math.sqrt(y.reduce((s,v)=>s+(v-mean)**2,0)/n)||1
  const unit=roundUnit(y),floor=(unit/Math.sqrt(12))/sd*0.5
  const front=new Map()
  const score=e=>Math.log10(Math.max(e.errN,floor))+0.035*e.size
  const ev=t=>{
    if(gpSize(t)>MAX)return null
    const e=gpEval(t,X,y,cache,sd);if(!e)return null
    const f=front.get(e.size);if(!f||e.errN<f.errN)front.set(e.size,e)
    e.score=score(e);return e
  }
  const pending=gpSeeds(vars)
  let pop=[],next=null,gen=0
  const tourn=()=>{let b=null;for(let i=0;i<4;i++){const c=gpPick(pop);if(!b||c.score<b.score)b=c}return b}
  const elites=()=>[...pop].sort((a,b)=>a.score-b.score).slice(0,8)
  return{
    step(ms){
      const t0=Date.now();let guard=0
      while(Date.now()-t0<ms&&guard++<300){
        if(!next){
          const e=ev(pending.length?pending.shift():gpRand(nv,3));if(e)pop.push(e)
          if(pop.length>=N)next=elites()
          continue
        }
        const e=ev(Math.random()<0.4?gpCross(tourn().tree,tourn().tree):gpMutate(tourn().tree,nv))
        if(e)next.push(e)
        if(next.length>=N){pop=next;gen++;next=elites()}
      }
      return{gen,checked:cache.size}
    },
    /** 크기별 최선 중, 더 작은 것보다 오차가 줄어드는 것만 (복잡도-오차 경계) */
    front(){
      const out=[];let best=Infinity
      for(const e of [...front.values()].sort((a,b)=>a.size-b.size))if(e.errN<best*0.98){out.push(e);best=e.errN}
      return out
    },
    floor,unit,
  }
}
/** 심도 탐색 결과 하나를 빠른 탐색 결과와 같은 모양의 모델로 (정리·예측·표시에 같이 씀) */
function gpModel(e,vars,X,y,Xt,yt,quick,tol,tolT){
  const names=vars.map(v=>v.name),k=e.k
  const form=p=>{const cs=p.slice(0,k);return pretty('결과 = '+coef(p[k])+' + '+coef(p[k+1])+'×('+gpStr(e.tree,names,cs)+')')}
  const m={name:'크기 '+e.size,desc:'',k:e.k+2,size:e.size,f:e.fn,p:e.p.slice(),form,snap:true,predict:x=>e.fn(m.p,x),
    spec:{type:'gp',body:gpCompile(e.tree).body,k:e.k}}
  m.formula=form(m.p)
  const unit=roundUnit(y)
  m.pr=X.map(x=>m.f(m.p,x));m.res=m.pr.map((v,i)=>v-y[i]);m.sse=m.res.reduce((s,v)=>s+v*v,0)
  m.rmse=Math.sqrt(m.sse/y.length);m.maxAbs=Math.max(...m.res.map(Math.abs))
  m.maxRel=Math.max(...m.res.map((v,i)=>Math.abs(v)/(Math.abs(y[i])||1)))
  m.exact=within(m.res,unit,tol)
  if(m.exact&&!quick)tidy(m,X,y,unit,tol)
  if(Xt&&Xt.length){
    const r=Xt.map((x,i)=>m.f(m.p,x)-yt[i])
    m.testAbs=Math.max(...r.map(Math.abs));m.testRel=Math.max(...r.map((v,i)=>Math.abs(v)/(Math.abs(yt[i])||1)))
    m.testExact=within(r,roundUnit(yt),tolT)
  }
  return m
}

if(typeof module!=='undefined')module.exports={num,fitModels,hints,parseChanges,coef,gpEngine,gpModel}

</script>

<script>
// ---------------------------------------------------------------- 저장 (앱 안이면 앱 저장소, 아니면 브라우저)
const BR=typeof window.TMCalc!=='undefined'
if(BR)document.documentElement.dataset.theme='dark'

const $=s=>document.querySelector(s)
let data,active

function copyText(t){

  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(done,fallback)

}
/** 잰 값 칸: 여러 번 잰 숫자 → [숫자…] (띄어쓰기·/ 로 구분, 쉼표는 천 단위 구분) */
function nums(text){return String(text||'').trim().split(/[\s/]+/).map(num).filter(isFinite)}

const mtext=(r,mid)=>{const a=r.samples&&r.samples[mid];return a&&a.length>1?`${fmt(mval(r,mid))} <span class="mut">(${a.length}회)</span>`:fmt(r.values[mid])}
const tpl=id=>data.templates.find(t=>t.id===id)
const ses=id=>data.sessions.find(s=>s.id===id)
const fdate=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

function importText(text){
  try{
    const o=JSON.parse(text);if(o.kind!=='tmcalc-lab-session'||!o.session)throw 0
    mutate(d=>{
      let tid=o.template&&o.template.id
      if(o.template&&!d.templates.some(t=>t.id===tid))d.templates.push(o.template)
      const s={...o.session,id:uid(),templateId:tid||o.session.templateId}
      if(d.sessions.some(q=>q.name===s.name))s.name+=' (불러옴)'
      d.sessions.push(s)
    })
    toast('세션을 불러왔어요.');nav=[{v:'home'}];render()
  }catch(_){alert('연구실 세션 파일이 아니에요.')}
}
window.onPickedFile=importText
$('#file').onchange=async e=>{const f=e.target.files[0];if(f)importText(await f.text());e.target.value=''}
function addSample(){
  // 실제 공식: 데미지 = (기본 1000 + 룬 고정) × (1 + 룬%) × (1 + 무기%)
  const g1=uid(),g2=uid(),m1=uid(),t={id:uid(),name:'예시: 룬·무기 → 데미지',groups:[{id:g1,name:'룬'},{id:g2,name:'무기'}],measures:[{id:m1,name:'데미지'}]}
  const steps=[[null,0,'flat'],[g1,150,'flat'],[g1,200,'flat'],[g1,5,'pct'],[g1,10,'pct'],[g2,8,'pct'],[g2,12,'pct'],[g1,-100,'flat'],[g2,-5,'pct'],[g1,7,'pct'],[g1,300,'flat'],[g2,20,'pct']]
  let fl=0,rp=0,wp=0;const recs=[];let t0=Date.now()-steps.length*60000
  for(const [g,ch,u] of steps){if(g===g1&&u==='flat')fl+=ch;if(g===g1&&u==='pct')rp+=ch;if(g===g2)wp+=ch
    recs.push({id:uid(),time:t0+=60000,groupId:g,change:ch,unit:u,values:{[m1]:Math.round((1000+fl)*(1+rp/100)*(1+wp/100))},note:''})}
  mutate(d=>{d.templates.push(t);d.sessions.push({id:uid(),name:'예시 세션',templateId:t.id,created:Date.now(),records:recs})})
}

// ---------------------------------------------------------------- 틀 만들기/고치기
function vTpl(c,v){
  const orig=c.id?tpl(c.id):null
  if(!c.draft)c.draft=orig?JSON.parse(JSON.stringify(orig)):{id:uid(),name:'',groups:[{id:uid(),name:'룬'},{id:uid(),name:'무기'}],measures:[{id:uid(),name:'데미지'}]}
  const t=c.draft
  $('#title').textContent=orig?'틀 수정':'새 틀'
  v.innerHTML=`<div class="card"><label class="f">틀 이름<input type="text" id="tn" value="${esc(t.name)}" placeholder="예: 룬·무기 → 데미지"></label></div>
  <div class="card"><div class="big">분류</div><div class="mut">바꿔 가며 실험할 것 (룬, 무기, 장비, 버프, 적 방어 …). 기록할 때 이 중에서 고르고 ±값이나 %를 적어요.</div>
    ${t.groups.map((g,i)=>`<div style="margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)"><div class="list-row"><input type="text" data-g="${i}" value="${esc(g.name)}" placeholder="분류 이름">
      ${(g.items||[]).length?'':`<label class="row mut" style="gap:4px" title="방어 계산에 들어가는 값 (적 방어, 방깎 …)"><input type="checkbox" data-gr="${i}"${g.reduce?' checked':''}>감소형</label>`}
      <button class="sm danger" data-gd="${i}">✕</button></div>
      ${(g.items||[]).map((it,j)=>`<div class="list-row" style="padding-left:18px"><span class="mut">└</span><input type="text" data-in="${i}:${j}" value="${esc(it.name)}" placeholder="항목 이름">
        <label class="row mut" style="gap:4px"><input type="checkbox" data-ir="${i}:${j}"${it.reduce?' checked':''}>감소형</label>
        <button class="sm danger" data-id="${i}:${j}">✕</button></div>`).join('')}
      <button class="sm ghost" data-ia="${i}" style="margin-left:18px">+ 항목</button></div>`).join('')}
    <button class="sm" id="ga">+ 분류</button>
    <details><summary>항목이란?</summary><div class="mut" style="margin-top:6px">
      한 분류 안에서 무엇이 오르는지 나눌 때 써요. 예: 스킬 → 공격력, 데미지 / 룬 → 공격력, 데미지, 치명타.<br>
      기록할 때 분류 → 항목 순서로 고르고, 공식 찾기에서는 '스킬 데미지 %', '스킬 공격력 %'처럼 따로 계산돼요.<br>
      같은 항목의 %가 분류가 달라도 합쳐지는지(항목별 곱), 분류마다 따로 곱해지는지(분류별 곱)도 시험해요.</div></details>
    <details><summary>감소형이란?</summary><div class="mut" style="margin-top:6px">
      <b>방어 계산</b>에 들어가는 값에 체크해요. 분류에 항목이 있으면 항목마다 따로 체크해요 (예: 스킬 → 공격력은 그냥, 방깎은 감소형).<br>
      · 적 방어, 받는 피해 감소, 저항: 높을수록 결과가 줄어들어요.<br>
      · 방깎(방어 감소): 깎을수록 결과가 늘어나요.<br>
      게임은 방어를 그냥 빼기보다 <b>비율로</b> 계산하는 경우가 많아요: 데미지 = 공격 × K / (K + 방어). (K=1000 이면 방어 1000일 때 절반)<br>
      체크하면 빠른 탐색이 이 모양을 시험하고 K 값도 찾아 줘요 (방깎이면 K 가 음수로 나와요 = K/(K−방깎) 꼴). 체크 안 해도 빼기형은 찾고, 심도 탐색은 조합으로도 찾지만 체크해 두면 더 빨라요.<br>
      공격력·데미지처럼 그냥 오르는 것은 체크하지 마세요.</div></details></div>
  <div class="card"><div class="big">잴 것</div><div class="mut">매번 화면에서 읽어 적을 값 (데미지, 표시 공격력, 전투력 …). 이 값들의 공식을 찾아요.</div>
    ${t.measures.map((m,i)=>`<div class="list-row"><input type="text" data-m="${i}" value="${esc(m.name)}" placeholder="잴 것 이름"><button class="sm danger" data-md="${i}">✕</button></div>`).join('')}
    <button class="sm" id="ma">+ 잴 것</button></div>
  <p class="mut">틀을 고치면 이 틀을 쓰는 세션에도 바로 반영돼요.</p>
  <div class="row"><button class="pri" id="ts">저장</button><button id="tc">취소</button></div>`
  const sync=()=>{t.name=$('#tn').value
    v.querySelectorAll('[data-g]').forEach(e=>t.groups[+e.dataset.g].name=e.value)
    v.querySelectorAll('[data-gr]').forEach(e=>t.groups[+e.dataset.gr].reduce=e.checked)
    const ij=k=>k.split(':').map(Number)
    v.querySelectorAll('[data-in]').forEach(e=>{const [i,j]=ij(e.dataset.in);t.groups[i].items[j].name=e.value})
    v.querySelectorAll('[data-ir]').forEach(e=>{const [i,j]=ij(e.dataset.ir);t.groups[i].items[j].reduce=e.checked})
    v.querySelectorAll('[data-m]').forEach(e=>t.measures[+e.dataset.m].name=e.value)}
  $('#ga').onclick=()=>{sync();t.groups.push({id:uid(),name:'',items:[]});render()}
  v.querySelectorAll('[data-ia]').forEach(b=>b.onclick=()=>{sync();const g=t.groups[+b.dataset.ia];(g.items=g.items||[]).push({id:uid(),name:''});render()})
  v.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{sync();const [i,j]=b.dataset.id.split(':').map(Number);t.groups[i].items.splice(j,1);render()})
  $('#ma').onclick=()=>{sync();t.measures.push({id:uid(),name:''});render()}
  v.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>{sync();t.groups.splice(+b.dataset.gd,1);render()})
  v.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{sync();t.measures.splice(+b.dataset.md,1);render()})
  $('#tc').onclick=()=>back()
  $('#ts').onclick=()=>{sync()
    t.name=t.name.trim();t.groups=t.groups.filter(g=>g.name.trim());t.groups.forEach(g=>g.items=(g.items||[]).filter(x=>x.name.trim()));t.measures=t.measures.filter(m=>m.name.trim())
    if(!t.name)return alert('틀 이름을 적어 주세요.')
    if(!t.measures.length)return alert('잴 것을 하나 이상 넣어 주세요.')
    mutate(d=>{const i=d.templates.findIndex(q=>q.id===t.id);if(i>=0)d.templates[i]=t;else d.templates.push(t)})
    back()}
}

/** 시작 상태 칸 목록: 분류(항목) × 값/% → key "분류id:항목id:flat|pct" */
function startSlots(t){
  const out=[]
  for(const g of t.groups){
    const its=(g.items||[]).length?g.items:[null]
    for(const it of its)out.push({label:g.name+(it?' '+it.name:''),key:g.id+':'+(it?it.id:'')})
  }
  return out
}
function vStart(c,v){
  const s=ses(c.id);if(!s)return back()
  const t=tpl(s.templateId)||{groups:[]},st=s.start||{}
  $('#title').textContent=s.name+' · 시작 상태'
  const sl=startSlots(t)
  v.innerHTML=`<div class="card"><div class="big">세션을 시작할 때 이미 붙어 있던 양</div>
    <div class="mut">상태창 등에서 보이는 지금 값을 적어요. 모르는 칸은 비워 두면 그 항목은 바꾼 양(변화량)만으로 계산해요.<br>
    적어 두면 공식 찾기가 실제 총량으로 계산해서 계수가 깔끔해지고, 합연산/곱연산도 더 정확히 가려요.</div>
    ${c.fresh?'<div class="mut good" style="margin-top:6px">세션을 만들었어요. 시작 상태를 적고 저장하세요 (나중에 해도 돼요).</div>':''}

function recText(t,r){
  const G=r.groupId?(t&&t.groups.find(x=>x.id===r.groupId)):null
  if(!r.groupId)return'기준 (변경 없음)'
  const it=r.itemId?((G&&(G.items||[]).find(x=>x.id===r.itemId))||{name:'(지운 항목)'}).name:''
  return`${G?G.name:'(지운 분류)'}${it?' '+it:''} ${r.change>=0?'+':''}${fmt(r.change)}${r.unit==='pct'?'%':''}`
}

// ---------------------------------------------------------------- 공식 찾기
/** 세션 기록 → 변수(분류별 누적 변화량, 잰 값)와 결과 */
function sessionData(s){
  const t=tpl(s.templateId)||{groups:[],measures:[]}
  const gname=id=>(t.groups.find(g=>g.id===id)||{name:'(지운 분류)'}).name
  const iname=(gid,iid)=>{const G=t.groups.find(g=>g.id===gid),it=G&&(G.items||[]).find(x=>x.id===iid);return it?it.name:'(지운 항목)'}
  const keyOf=r=>r.groupId+':'+(r.itemId||'')+':'+(r.unit||'flat')
  const keys=[],stack={}
  for(const r of s.records)if(r.groupId&&r.change){const k=keyOf(r);if(!keys.includes(k))keys.push(k);stack[k]=(stack[k]||0)+1}
  const gvars=keys.map(k=>{const [g,i,u]=k.split(':'),G=t.groups.find(x=>x.id===g),it=i?iname(g,i):null
    const IT=i&&G?(G.items||[]).find(x=>x.id===i):null
    const known=isFinite((s.start||{})[k])
    return{id:'g:'+k,name:gname(g)+(it?' '+it:'')+(u==='pct'?' %':(known?'':' 변화')),cat:gname(g),item:it,unit:u,reduce:IT?!!IT.reduce:!!(G&&G.reduce),stack:stack[k],known}})
  const mvars=t.measures.map(m=>({id:'m:'+m.id,name:m.name,cat:'잰 값',unit:'flat'}))
  // % 는 두 가지로 누적: 더해서(합연산) / 곱해서(곱연산, ×(1+a%)×(1+b%)…)
  // 시작 상태를 적었으면 거기서부터 누적 (실제 총량), 아니면 0 부터 (변화량)
  const acc={},accC={}
  for(const x of gvars){const s0=(s.start||{})[x.id.slice(2)];if(isFinite(s0)){acc[x.id]=s0;accC[x.id]=s0}}
  const rows=s.records.map((r,i)=>{
    if(r.groupId&&r.change){const k='g:'+keyOf(r);acc[k]=(acc[k]||0)+r.change;accC[k]=((1+(accC[k]||0)/100)*(1+r.change/100)-1)*100}
    const v={};gvars.forEach(x=>{v[x.id]=acc[x.id]||0;if(x.unit==='pct')v[x.id+'*']=accC[x.id]||0})
    const tol={}
    t.measures.forEach(m=>{const a=r.samples&&r.samples[m.id]
      if(a&&a.length){v['m:'+m.id]=mval(r,m.id);if(a.length>1)tol['m:'+m.id]=(Math.max(...a)-Math.min(...a))/2}
      else if(isFinite(r.values[m.id]))v['m:'+m.id]=r.values[m.id]})
    return{no:i+1,r,v,tol}})
  return{t,gvars,mvars,rows}
}
function vFind(c,v){
  const s=ses(c.id);if(!s)return back()
  const D=sessionData(s),t=D.t
  $('#title').textContent=s.name+' · 공식 찾기'
  if(!t.measures.length||s.records.length<3){v.innerHTML='<div class="card empty">기록이 3개 이상 있어야 공식을 찾을 수 있어요.</div>';return}
  c.target=c.target&&t.measures.some(m=>m.id===c.target)?c.target:t.measures[0].id
  const all=[...D.gvars,...D.mvars.filter(m=>m.id!=='m:'+c.target)]
  if(!c.use)c.use=D.gvars.filter(x=>new Set(D.rows.map(r=>r.v[x.id])).size>1).map(x=>x.id)
  v.innerHTML=`<div class="card">
    <label class="f">무엇의 공식을 찾을까요?<select id="ft">${t.measures.map(m=>`<option value="${m.id}"${m.id===c.target?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
    <div class="mut" style="margin-top:10px">무엇으로 계산될까요? (분류별 변화량은 세션 처음부터 더한 값)</div>
    <div class="chips">${all.map(x=>`<button class="chip${c.use.includes(x.id)?' on':''}" data-use="${x.id}">${esc(x.name)}</button>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="pri" id="qk">빠른 탐색</button><button class="pri" id="dp">심도 탐색</button>
      <select id="dt">${[[15,'15초'],[30,'30초'],[60,'1분'],[180,'3분']].map(([s,l])=>`<option value="${s}"${(c.secs||30)==s?' selected':''}>${l}</option>`).join('')}</select>
      <label class="row mut" style="gap:4px"><input type="checkbox" id="hold"${c.hold!==false?' checked':''}>검증용 기록 남기기</label></div>
    <details><summary>설명</summary><div class="mut">빠른 탐색: 자주 쓰는 공식 틀 6가지를 맞춰 보고 오차가 적은 순으로 보여 줘요 (바로 끝남).<br>
      심도 탐색: 틀 없이 변수·숫자·＋−×÷·(1+%)·max 를 조합해서 공식 자체를 찾아요. 단순하면서 오차가 적은 것을 추천해요.<br>
      두 번 이상 쌓은 % 는 더해서 쌓이는지(합연산) 곱해서 쌓이는지(곱연산, 이름에 '(곱)')도 둘 다 시험해요.<br>
      검증용 기록 남기기: 5개 중 1개는 찾는 데 안 쓰고, 찾은 공식이 처음 보는 기록도 맞히는지 확인해요 (기록 10개 이상일 때).<br>
      버튼을 다시 누르면 다시 찾아요. 후보는 최대 6개씩 보여 줘요.<br>
      찾은 후보는 세션에 자동으로 남고(대상·탐색 종류별 마지막 결과), [저장]한 공식은 따로 모여요. 세션 [내보내기] 파일에 둘 다 들어가요.</div></details></div>
  <div id="saved"></div><div id="out"></div>`
  showSaved(c)
  $('#ft').onchange=e=>{c.target=e.target.value;c.res=null;render()}
  v.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const id=b.dataset.use;c.use=c.use.includes(id)?c.use.filter(q=>q!==id):[...c.use,id];c.res=null;render()})
  $('#dt').onchange=e=>c.secs=+e.target.value
  $('#hold').onchange=e=>c.hold=e.target.checked
  const prep=()=>{
    const vars=all.filter(x=>c.use.includes(x.id)),tk='m:'+c.target
    const rows=D.rows.filter(r=>!r.r.skip&&isFinite(r.v[tk])&&vars.every(x=>isFinite(r.v[x.id])))
    // 흔들림은 기록마다 비슷하다고 보고, 여러 번 잰 기록 중 가장 큰 흔들림 비율을 모든 기록에 적용 (3번만 재면 폭이 작게 잡힐 수 있어서)
    const rel=Math.max(0,...rows.map(r=>(r.tol[tk]||0)/(Math.abs(r.v[tk])||1)))
    const tol=rows.map(r=>rel*Math.abs(r.v[tk]))
    return{vars,rows,X:rows.map(r=>vars.map(x=>r.v[x.id])),y:rows.map(r=>r.v[tk]),tol:tol.some(x=>x)?tol:null,
      skipped:D.rows.filter(r=>r.r.skip).length,tname:t.measures.find(m=>m.id===c.target).name}
  }
  $('#qk').onclick=()=>{const P=prep();if(!P.vars.length)return alert('계산에 쓸 것을 하나 이상 골라 주세요.')
    if(P.rows.length<3)return alert('이 값이 들어 있는 기록이 3개 이상 필요해요.')
    const QA=quickAll(P),models=QA.models
    c.dropped=QA.dropped.map(i=>P.rows[i].r.id)
    const H=hints(P.vars,P.X,P.y,models)
    if(QA.dropped.length)H.unshift(`⚠ 크게 어긋나는 기록 ${QA.dropped.map(i=>'#'+P.rows[i].no).join(', ')} 은(는) 빼고 계산했어요. 입력 실수인지 [기록]에서 확인해 보세요.`)
    if(P.tol){const w=Math.max(...P.tol.map((d,i)=>d/(Math.abs(P.y[i])||1)))
      H.unshift(`여러 번 잰 기록의 흔들림: 최대 ±${fmt(w*100,2)}% (이 안의 차이는 오차로 보지 않아요).`)}
    if(P.skipped)H.push(`[빼기]한 기록 ${P.skipped}개는 빼고 찾았어요.`)
    const unk=P.vars.filter(x=>x.known===false)
    if(unk.length)H.push(`시작 상태가 비어 있는 항목: ${unk.map(x=>x.name).join(', ')}. 세션의 [시작 상태]에 처음 값을 적으면 계수가 깔끔해지고 합연산/곱연산을 더 정확히 가려요.`)
    c.res={kind:'quick',P,models,hints:H,dropped:c.dropped};if(models.length)storeResult(c,c.res);showRes(c)}
  $('#dp').onclick=()=>runDeep(c,prep())
  if(c.res)showRes(c)
  else showPast(c)
}
/** 저장한 공식 (세션에 남고, 내보내기에도 들어감) */
function showSaved(c){
  const s=ses(c.id),el=$('#saved');if(!el||!s)return
  const L=s.saved||[]
  el.innerHTML=L.length?`<h2>저장한 공식 <span class="mut">${L.length}개</span></h2>`+L.map(f=>`<div class="card">
    <div class="mut">${esc(f.targetName)} · ${f.kind==='deep'?'심도':'빠른'} 탐색 · 기록 ${f.records}개 · ${fdate(f.time)}${f.exact?' · <span class="good">완전 일치</span>':''}</div>
    <div class="formula">${esc(f.formula)}</div>
    <div class="row"><span class="mut" style="flex:1">최대 오차 ${fmt(f.maxAbs)}${f.testAbs!=null?` · 검증 ${fmt(f.testAbs)}`:''}</span>
      ${f.calc?`<button class="sm" data-go-opt="${f.id}">최적화</button>`:''}<button class="sm" data-cp="${esc(f.formula)}">복사</button><button class="sm danger" data-sdel="${f.id}">✕</button></div></div>`).join(''):''
  el.querySelectorAll('[data-go-opt]').forEach(b=>b.onclick=()=>{mutate(d=>{const x=d.sessions.find(q=>q.id===c.id);if(x){x.opt=x.opt||{};x.opt.formula=b.dataset.goOpt}});go({v:'opt',id:c.id})})
  el.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copyText(b.dataset.cp))
  el.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{if(!confirm('저장한 공식을 지울까요?'))return
    mutate(d=>{const x=d.sessions.find(q=>q.id===c.id);if(x)x.saved=(x.saved||[]).filter(q=>q.id!==b.dataset.sdel)});showSaved(c)})
}
/** 지난 탐색 결과 (이 화면에서 아직 안 찾았을 때) */
function showPast(c){
  const s=ses(c.id),o=$('#out');if(!o||!s)return

/**

function quickAll(P){
  // 크게 어긋나는 기록(입력 실수 등)이 공식을 끌어당기지 않게: 하나씩 빼 보며 다시 맞춘다 (최대 기록의 20%)

    const sub={...P,rows:keep.map(i=>P.rows[i]),y:keep.map(i=>P.y[i]),tol:P.tol?keep.map(i=>P.tol[i]):null}
    const ms=quickFit(sub,P),m=ms[0]
    if(!m||m.exact||dropped.length>=Math.floor(P.rows.length*0.2)||keep.length<6)return{models:ms,dropped}
    const unit=roundUnit(sub.y),a=m.res.map(Math.abs),med=[...a].sort((p,q)=>p-q)[a.length>>1]

/** 두 번 이상 쌓은 % 는 합연산/곱연산 누적을 둘 다 (최대 4개 → 16가지 조합), 모두 합쳐 잘 맞는 순 6개 */
function quickFit(sub,P){
  const st=P.vars.map((x,i)=>i).filter(i=>P.vars[i].unit==='pct'&&P.vars[i].stack>=2).slice(0,4)
  const all=[]
  for(let mask=0;mask<(1<<st.length);mask++){
    const comp=st.filter((_,b)=>mask&(1<<b))
    const vars=P.vars.map((x,i)=>comp.includes(i)?{...x,name:x.name+'(곱)'}:x)
    const xs=r=>P.vars.map((x,i)=>comp.includes(i)?r.v[x.id+'*']:r.v[x.id])
    for(const m of fitModels(vars,sub.rows.map(xs),sub.y,sub.tol)){if(m.skip)continue
      m.vars=vars;m.X=P.rows.map(xs);m.comp=comp.length   // 표시·예측은 모든 기록으로
      if(comp.length)m.name+=' · 곱연산: '+comp.map(i=>P.vars[i].name).join(', ')
      all.push(m)}
  }
  all.sort((a,b)=>(b.exact-a.exact)||(a.exact&&b.exact?(a.k-b.k)||(a.comp-b.comp):0)||a.score-b.score)
  return all.slice(0,6)
}
function runDeep(c,P){

  }

// ---------------------------------------------------------------- 최적화: 저장한 공식으로 내 상태 → 바꿔 보기 → 최적 셋팅
/** 최적화에 쓸 수 있는 공식: 저장한 공식 + 지난 탐색의 추천 */
function optFormulas(s){
  const L=(s.saved||[]).filter(f=>f.calc).map(f=>({key:f.id,label:'저장: '+f.formula,f:{...f.calc,target:f.target,targetName:f.targetName,formula:f.formula}}))

}
/** 변수 상태에 변경 하나 적용 (% 는 곱연산 누적값 id* 도 같이) */
function applyChange(st,vid,op,val,pct){
  const v=st[vid]||0,cv=st[vid+'*']??v
  if(op==='='){st[vid]=val;if(pct)st[vid+'*']=val;return}
  const d=op==='-'?-val:val
  st[vid]=v+d
  if(pct)st[vid+'*']=op==='-'?((1+cv/100)/(1+val/100)-1)*100:((1+cv/100)*(1+val/100)-1)*100

/** 특수 효과 규칙: 대상 += 식 ([이름] 으로 다른 값 참조) */
function applyRules(st,rules,names){
  for(const r of rules||[]){
    if(!r.target||!r.expr)continue
    try{
      const js=r.expr.replace(/\[([^\]]+)\]/g,(_,n)=>{const id=names[n.trim()];return id?`(${+(st[id]||0)})`:'0'})
      if(/[^0-9+\-*/().\s]/.test(js))continue
      const val=Function('return ('+js+')')()
      if(isFinite(val))applyChange(st,r.target,r.op||'+',val,r.pct)
    }catch(e){}
  }
  return st
}

      rec(0,[]);note=`조합 ${total.toLocaleString()}가지를 모두 계산했어요.`
    }else{
      // 너무 많으면: 지금 셋팅에서 시작해 넣기·빼기·바꾸기를 더 좋아질 때까지 반복
      let cur=inv.map((it,i)=>i).filter(i=>inv[i].on),r=score(cur),improved=true,steps=0
      const ok=set=>slots.every(sl=>set.filter(i=>(inv[i].slot||'기타')===sl).length<=lim(sl))
      while(improved&&steps++<200){improved=false
        const cands=[];inv.forEach((_,i)=>{if(cur.includes(i))cands.push(cur.filter(q=>q!==i));else{cands.push([...cur,i]);cur.forEach(q=>cands.push([...cur.filter(z=>z!==q),i]))}})
        for(const cs of cands)if(ok(cs)){const v2=score(cs);if(v2>r+1e-9){r=v2;cur=cs;improved=true}}}
      best={r,set:cur};note=`조합이 ${total.toLocaleString()}가지라 지금 셋팅에서 넣기·빼기·바꾸기로 좋아질 때까지 찾았어요 (가장 좋은 조합이 아닐 수도 있어요).`
    }
  }
  v.innerHTML=`<div class="card"><label class="f">쓸 공식<select id="of">${FL.map(x=>`<option value="${x.key}"${x===pick?' selected':''}>${esc(x.label)}</option>`).join('')}</select></label>
    <div class="formula">${esc(F.formula)}</div></div>
  <div class="card"><div class="big">내 상태</div><div class="mut">마지막 기록 기준이에요. 지금 상태가 다르면 고치세요 (비우면 마지막 기록 값).</div>
    <div class="grid" style="margin-top:8px">${used.map(id=>`<label class="f">${esc((byId[id]||{name:id}).name)}<input type="text" data-st="${id}" value="${isFinite((o.state||{})[id])?o.state[id]:''}" placeholder="${fmt((lastRow&&lastRow.v[id])||0)}"></label>`).join('')}</div>
    <div class="big" style="margin-top:10px">예상 ${esc(F.targetName)}: ${fmt(now)}</div></div>
  <div class="card"><div class="big">특수 효과</div><div class="mut">게임 설명에 적힌 효과를 식으로 적어요. 다른 값은 [이름]으로 불러요. 예: 대상 '스킬 공격력 %' · += · <code>[마력] * 0.1</code></div>
    ${(o.rules||[]).map((r,k)=>`<div class="list-row" data-rule="${k}">${varSel(r.target,'rt')}<select class="rop2">${['+','='].map(q=>`<option${q===(r.op||'+')?' selected':''}>${q}</option>`).join('')}</select><input type="text" class="rex" value="${esc(r.expr||'')}" placeholder="[마력] * 0.1" style="flex:1"><button class="sm danger rrm">✕</button></div>`).join('')}
    <button class="sm" id="addRule">+ 효과</button></div>
  <div class="card"><div class="big">바꿔 보기</div><div class="mut">무엇을 바꾸면 얼마나 변하는지. 여러 줄을 한 묶음으로 (예: 룬 A 빼고 B 끼기).</div>
    ${(o.whatif||[]).map((w,k)=>{const q=whatIf[k];return`<div class="card" style="background:var(--card2)" data-wi="${k}"><div class="list-row"><input type="text" class="wn" value="${esc(w.name||'')}" placeholder="이름 (예: 룬 B로 교체)" style="flex:1"><b>${isFinite(q.r)?pctTxt(q.g):'-'}</b><button class="sm danger wdel">✕</button></div>
      ${rowsUI(w.rows,'w'+k)}<button class="sm ghost wadd">+ 바뀌는 값</button><div class="mut">→ ${fmt(q.r)}</div></div>`}).join('')}
    <button class="sm" id="addWi">+ 바꿔 보기</button></div>
  <div class="card"><div class="big">최적 셋팅</div><div class="mut">가진 옵션(룬, 장비 …)을 넣고 칸(슬롯)마다 낄 수 있는 개수를 정하면, 가장 높은 조합을 찾아요. 지금 낀 것은 '낌'에 체크하세요.</div>
    ${inv.map((it,k)=>`<div class="card" style="background:var(--card2)" data-iv="${k}"><div class="list-row"><input type="text" class="in" value="${esc(it.name||'')}" placeholder="이름 (예: 공격 룬 +8.5만)" style="flex:1">
      <input type="text" class="isl" value="${esc(it.slot||'')}" placeholder="칸 (룬)" style="width:70px"><label class="row mut" style="gap:4px"><input type="checkbox" class="ion"${it.on?' checked':''}>낌</label><button class="sm danger idel">✕</button></div>
      ${rowsUI(it.rows,'i'+k)}<button class="sm ghost iadd">+ 바뀌는 값</button></div>`).join('')}
    <button class="sm" id="addInv">+ 옵션</button>
    ${inv.length?`<div class="row" style="margin-top:8px">${[...new Set(inv.map(it=>it.slot||'기타'))].map(sl=>`<label class="row mut" style="gap:4px">${esc(sl)} 최대<input type="text" data-lim="${esc(sl)}" value="${limits[sl]??''}" placeholder="${inv.filter(it=>(it.slot||'기타')===sl).length}" style="width:50px"></label>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="pri" id="solve">최적 조합 찾기</button></div>`:''}
    ${best?(()=>{const on=inv.map((it,i)=>i).filter(i=>inv[i].on),add=best.set.filter(i=>!on.includes(i)),rm=on.filter(i=>!best.set.includes(i))
      return`<div class="card model best" style="margin-top:10px"><div class="big">최적: ${esc(F.targetName)} ${fmt(best.r)} ${pctTxt((best.r-now)/now)}</div>
        <div>끼기: ${best.set.map(i=>esc(inv[i].name||'#'+(i+1))).join(', ')||'-'}</div>
        <div class="good">넣기: ${add.map(i=>esc(inv[i].name||'#'+(i+1))).join(', ')||'없음'}</div><div class="bad">빼기: ${rm.map(i=>esc(inv[i].name||'#'+(i+1))).join(', ')||'없음'}</div>
        <div class="mut">${esc(note)}</div></div>`})():''}
  </div>`
  const save=f=>{mutate(d=>{const x=d.sessions.find(q=>q.id===s.id);if(!x)return;x.opt=x.opt||{};f(x.opt)});c.solve=false;render()}
  $('#of').onchange=e=>save(op=>op.formula=e.target.value)
  v.querySelectorAll('[data-st]').forEach(e=>e.onchange=()=>save(op=>{op.state=op.state||{};const n=num(e.value);if(isFinite(n))op.state[e.dataset.st]=n;else delete op.state[e.dataset.st]}))
  // 규칙
  $('#addRule').onclick=()=>save(op=>(op.rules=op.rules||[]).push({target:allVars[0]&&allVars[0].id,op:'+',expr:''}))
  v.querySelectorAll('[data-rule]').forEach(el=>{const k=+el.dataset.rule
    const upd=()=>save(op=>{const r=op.rules[k];r.target=el.querySelector('.rt').value;r.pct=isPct(r.target);r.op=el.querySelector('.rop2').value;r.expr=el.querySelector('.rex').value})
    el.querySelector('.rt').onchange=upd;el.querySelector('.rop2').onchange=upd;el.querySelector('.rex').onchange=upd
    el.querySelector('.rrm').onclick=()=>save(op=>op.rules.splice(k,1))})
  // 줄 편집 (바꿔 보기 / 옵션 공통)
  const listOf=(op,key)=>key[0]==='w'?op.whatif[+key.slice(1)]:op.inv[+key.slice(1)]
  v.querySelectorAll('[data-row]').forEach(el=>{const [key,k]=el.dataset.row.split(':')
    const upd=()=>save(op=>{const r=listOf(op,key).rows[+k];r.vid=el.querySelector('.rv').value;r.op=el.querySelector('.rop').value;r.val=el.querySelector('.rval').value})
    el.querySelector('.rv').onchange=upd;el.querySelector('.rop').onchange=upd;el.querySelector('.rval').onchange=upd
    el.querySelector('.rdel').onclick=()=>save(op=>listOf(op,key).rows.splice(+k,1))})
  const firstVar=used[0]||(allVars[0]&&allVars[0].id)
  $('#addWi').onclick=()=>save(op=>(op.whatif=op.whatif||[]).push({name:'',rows:[{vid:firstVar,op:'+',val:''}]}))
  v.querySelectorAll('[data-wi]').forEach(el=>{const k=+el.dataset.wi
    el.querySelector('.wn').onchange=e=>save(op=>op.whatif[k].name=e.target.value)
    el.querySelector('.wdel').onclick=()=>save(op=>op.whatif.splice(k,1))
    el.querySelector('.wadd').onclick=()=>save(op=>op.whatif[k].rows.push({vid:firstVar,op:'+',val:''}))})
  $('#addInv').onclick=()=>save(op=>(op.inv=op.inv||[]).push({name:'',slot:'',on:false,rows:[{vid:firstVar,op:'+',val:''}]}))
  v.querySelectorAll('[data-iv]').forEach(el=>{const k=+el.dataset.iv
    el.querySelector('.in').onchange=e=>save(op=>op.inv[k].name=e.target.value)
    el.querySelector('.isl').onchange=e=>save(op=>op.inv[k].slot=e.target.value.trim())
    el.querySelector('.ion').onchange=e=>save(op=>op.inv[k].on=e.target.checked)
    el.querySelector('.idel').onclick=()=>save(op=>op.inv.splice(k,1))
    el.querySelector('.iadd').onclick=()=>save(op=>op.inv[k].rows.push({vid:firstVar,op:'+',val:''}))})
  v.querySelectorAll('[data-lim]').forEach(e=>e.onchange=()=>save(op=>{op.limits=op.limits||{};op.limits[e.dataset.lim]=e.value}))
  const sv=$('#solve');if(sv)sv.onclick=()=>{c.solve=true;render()}
}

// ---------------------------------------------------------------- 그래프 (SVG)
function svgPlot(pts,line,xl,yl,diag){
  const W=320,H=210,L=52,B=28,T=10,Rr=10
  const xs=pts.map(p=>p[0]).concat(line?line.map(p=>p[0]):[]),ys=pts.map(p=>p[1]).concat(line?line.map(p=>p[1]):[])
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys)
  if(x1===x0){x0-=1;x1+=1}if(y1===y0){y0-=1;y1+=1}
  const px=x=>L+(x-x0)/(x1-x0)*(W-L-Rr),py=y=>H-B-(y-y0)/(y1-y0)*(H-B-T)
  const sh=v=>Math.abs(v)>=1e4?fmt(v/1e4,1)+'만':fmt(v,2)
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;display:block;margin:8px 0">
    <line x1="${L}" y1="${H-B}" x2="${W-Rr}" y2="${H-B}" stroke="var(--line)"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="var(--line)"/>
    <text x="${L}" y="${H-8}" font-size="10" fill="var(--mut)">${sh(x0)}</text><text x="${W-Rr}" y="${H-8}" font-size="10" fill="var(--mut)" text-anchor="end">${sh(x1)}</text>
    <text x="${L-4}" y="${H-B}" font-size="10" fill="var(--mut)" text-anchor="end">${sh(y0)}</text><text x="${L-4}" y="${T+8}" font-size="10" fill="var(--mut)" text-anchor="end">${sh(y1)}</text>
    <text x="${(L+W)/2}" y="${H-8}" font-size="11" fill="var(--mut)" text-anchor="middle">${esc(xl)}</text>
    <text x="10" y="${(H-B)/2}" font-size="11" fill="var(--mut)" transform="rotate(-90 10 ${(H-B)/2})" text-anchor="middle">${esc(yl)}</text>`
  if(diag){const a=Math.max(x0,y0),b=Math.min(x1,y1);g+=`<line x1="${px(a)}" y1="${py(a)}" x2="${px(b)}" y2="${py(b)}" stroke="var(--acc)" stroke-dasharray="4 3"/>`}
  if(line)g+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${line.map(p=>px(p[0]).toFixed(1)+','+py(p[1]).toFixed(1)).join(' ')}"/>`
  for(const p of pts)g+=`<circle cx="${px(p[0]).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="${p[2]?5:3.5}" fill="${p[2]?'var(--bad)':'var(--fg)'}" fill-opacity="${p[2]?1:.7}"><title>#${p[3]}: ${fmt(p[1])}</title></circle>`
  return g+'</svg>'
}
function drawGraphs(box,m,R){
  const P=R.P,X=m.X||P.X,vars=m.vars||P.vars,drop=R.dropped||[]
  const pts=P.rows.map((r,j)=>[m.predict(X[j]),P.y[j],drop.includes(r.r.id),r.no])
  let h=`<div class="mut">예측(가로) vs 실제(세로). 점선 위에 있으면 공식과 맞아요. 빨간 점은 뺀 기록.</div>`+svgPlot(pts,null,'예측','실제',true)
  h+=`<label class="f" style="margin-top:6px">변수별로 보기<select class="gv">${vars.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}</select></label><div class="g2"></div>`
  box.innerHTML=h
  const one=()=>{const i=+box.querySelector('.gv').value,col=X.map(x=>x[i]),lo=Math.min(...col),hi=Math.max(...col),last=X[X.length-1]
    const line=[];for(let k=0;k<=40;k++){const z=last.slice();z[i]=lo+(hi-lo)*k/40;line.push([z[i],m.predict(z)])}
    box.querySelector('.g2').innerHTML=`<div class="mut">선: 다른 값은 마지막 기록 그대로 두고 '${esc(vars[i].name)}'만 바꿨을 때의 공식. 점: 기록 (다른 값도 바뀐 기록은 선에서 떨어져 보일 수 있어요).</div>`+
      svgPlot(P.rows.map((r,j)=>[X[j][i],P.y[j],drop.includes(r.r.id),r.no]),line,vars[i].name,P.tname,false)}
  box.querySelector('.gv').onchange=one;one()
}

/** 추천 공식으로: 지금(마지막 기록) 상태에서 하나씩 조금 올리면 얼마나 오르나 */
function gainTable(m,P){
  if(!P.rows.length)return''
  const x0=P.X[P.X.length-1],now=m.predict(x0);if(!isFinite(now)||!now)return''
  const rows=P.vars.map((x,i)=>{const st=x.unit==='pct'?1:(()=>{const a=Math.abs(x0[i])*0.01;if(!a)return 1;const e=10**Math.floor(Math.log10(a));return Math.round(a/e)*e})()
    const z=x0.slice();z[i]+=st;const r=m.predict(z);return{x,st,g:(r-now)/now}}).sort((a,b)=>b.g-a.g)
  return`<details><summary>무엇을 올리면 가장 이득? (마지막 기록 기준)</summary><div class="scroll"><table><tr><th class="l">항목</th><th>올리는 양</th><th>${esc(P.tname)} 변화</th></tr>
    ${rows.map(q=>`<tr><td class="l">${esc(q.x.name)}</td><td>+${fmt(q.st)}${q.x.unit==='pct'?'%':''}</td><td class="${q.g>0?'good':q.g<0?'bad':''}">${q.g>=0?'+':''}${fmt(q.g*100,3)}%</td></tr>`).join('')}</table></div></details>`
}
