<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연구실</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--card2:#f7f7fa;--fg:#1d2026;--mut:#6b7079;--line:#e1e4e8;--acc:#6d4fc2;--acc-fg:#fff;--acc-bg:#efeafd;--good:#1f8a4c;--bad:#c2410c;--in:#fff;--hl:#fff7d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222429;--card2:#2a2c32;--fg:#e8e9ec;--mut:#9a9da3;--line:#363940;--acc:#b39ddb;--acc-fg:#17181b;--acc-bg:#2f2a3d;--good:#5fd08f;--bad:#ff9a6a;--in:#1b1c20;--hl:#3a3420}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222429;--card2:#2a2c32;--fg:#e8e9ec;--mut:#9a9da3;--line:#363940;--acc:#b39ddb;--acc-fg:#17181b;--acc-bg:#2f2a3d;--good:#5fd08f;--bad:#ff9a6a;--in:#1b1c20;--hl:#3a3420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px}
header h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:8px 16px 80px}
h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.big{font-size:16px;font-weight:600}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:600}
button.sm{padding:4px 10px;font-size:13px}
button.danger{color:var(--bad)}
button.ghost{background:none;border:none;padding:6px 8px}
input,select{font:inherit;font-size:15px;background:var(--in);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
label.f input,label.f select{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acc);color:var(--acc-fg);margin-left:6px;vertical-align:middle;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acc-bg);color:var(--acc);margin:2px 4px 2px 0}
.tag.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border-radius:16px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600}
td.l,th.l{text-align:left}
tr.worst td{background:var(--hl)}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:14px;word-break:break-all;margin:8px 0;padding:10px;background:var(--card2);border-radius:10px}
.model.best{border-color:var(--acc);background:var(--acc-bg)}
.good{color:var(--good)}.bad{color:var(--bad)}
ul.hints{margin:6px 0;padding-left:20px}
ul.hints li{margin:4px 0}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:6px}
.list-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.list-row input[type=text]{flex:1}
.empty{text-align:center;padding:24px 12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:8px 12px}
.seg button.on{background:var(--acc);color:var(--acc-fg)}
.qm{width:24px;height:24px;padding:0;border-radius:12px;font-size:13px;font-weight:700;line-height:22px;text-align:center;color:var(--acc);border-color:var(--acc);background:none;vertical-align:middle;flex:none}
.hmask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hbox{background:var(--card);color:var(--fg);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 28px}
.hbox h3{margin:0 0 10px;font-size:17px;color:var(--acc)}
.hbox p{margin:8px 0}
.hbox .ex{background:var(--card2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.hbox .ex b{color:var(--acc)}
</style>

<body>
<header><button class="ghost" id="back" style="display:none">←</button><h1 id="title">연구실</h1><span id="hdr"></span></header>
<main id="view"></main>
<input id="file" type="file" accept=".json,application/json" style="display:none">

<script src="pets.js" onerror="0"></script>
<script id="core">

// ---------------------------------------------------------------- 숫자
/** "3억5952만", "191만9961", "16.6만", "+44.38%", "1,234" → 숫자 */
function num(s){
  if(s==null) return NaN
  s=String(s).replace(/[\s,]/g,'').replace(/%$/,'')
  if(s==='') return NaN
  let neg=false
  if(s[0]==='+') s=s.slice(1); else if(s[0]==='-'){neg=true;s=s.slice(1)}
  let t=0
  for(const [u,m] of [['경',1e16],['조',1e12],['억',1e8],['만',1e4]]){
    const i=s.indexOf(u)
    if(i>=0){const a=s.slice(0,i);const v=a===''?1:Number(a);if(!isFinite(v))return NaN;t+=v*m;s=s.slice(i+1)}
  }
  if(s!==''){const v=Number(s);if(!isFinite(v))return NaN;t+=v}
  return neg?-t:t
}
function fmt(v,d){
  if(!isFinite(v)) return '-'
  if(d!=null) return v.toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:0})
  const a=Math.abs(v)
  if(a>=1e6) return Math.round(v).toLocaleString('ko-KR')
  if(Math.abs(v-Math.round(v))<1e-9*Math.max(1,a)) return Math.round(v).toLocaleString('ko-KR')
  return Number(v.toPrecision(6)).toLocaleString('ko-KR',{maximumFractionDigits:6})
}
/** 계수 표시: 1.000002 → 1 처럼 깔끔한 값에 가까우면 그 값으로 */
function coef(v){
  for(const d of [0,1,2,3]){const r=Math.round(v*10**d)/10**d;if(Math.abs(v-r)<=Math.max(1e-6,Math.abs(v)*2e-5))return String(r)}
  return String(Number(v.toPrecision(6)))
}

// ---------------------------------------------------------------- 선형대수
function solve(A,b){
  const n=b.length,M=A.map((r,i)=>[...r,b[i]])
  for(let c=0;c<n;c++){
    let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r
    if(Math.abs(M[p][c])<1e-300)return null
    ;[M[c],M[p]]=[M[p],M[c]]
    for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c]/M[c][c];if(f)for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}
  }
  return M.map((r,i)=>r[n]/r[i])
}
/** 최소제곱 y ≈ c + Σ a_i x_i (열마다 크기를 맞춰서 풀어 큰 숫자도 안정적) */
function ols(X,y){
  const n=y.length,m=X[0]?X[0].length:0
  const sc=[...Array(m)].map((_,j)=>Math.max(1e-12,...X.map(r=>Math.abs(r[j]))))
  const D=X.map(r=>[1,...r.map((v,j)=>v/sc[j])])
  const k=m+1,A=[...Array(k)].map(()=>Array(k).fill(0)),b=Array(k).fill(0)
  for(let i=0;i<n;i++)for(let p=0;p<k;p++){b[p]+=D[i][p]*y[i];for(let q=0;q<k;q++)A[p][q]+=D[i][p]*D[i][q]}
  for(let p=0;p<k;p++)A[p][p]+=1e-10*(A[p][p]+1)
  const s=solve(A,b);if(!s)return null
  return [s[0],...s.slice(1).map((v,j)=>v/sc[j])]
}
/** Levenberg–Marquardt: 잔차 제곱합이 가장 작은 p */
function lm(f,p0,X,y,iters=400){
  let p=p0.slice(),lam=1e-3
  const R=q=>X.map((x,i)=>f(q,x)-y[i])
  const S=r=>r.reduce((s,v)=>s+v*v,0)
  let r=R(p),sse=S(r)
  if(!isFinite(sse))return{p,sse:Infinity}
  for(let it=0;it<iters;it++){
    const k=p.length,J=X.map(()=>Array(k))
    for(let j=0;j<k;j++){
      const h=1e-7*(Math.abs(p[j])+1e-4),q=p.slice();q[j]+=h
      for(let i=0;i<X.length;i++)J[i][j]=(f(q,X[i])-y[i]-r[i])/h
    }
    const A=[...Array(k)].map(()=>Array(k).fill(0)),g=Array(k).fill(0)
    for(let i=0;i<X.length;i++)for(let a=0;a<k;a++){g[a]+=J[i][a]*r[i];for(let b=0;b<k;b++)A[a][b]+=J[i][a]*J[i][b]}
    let improved=false
    for(let t=0;t<12;t++){
      const B=A.map((row,a)=>row.map((v,b)=>a===b?v*(1+lam)+1e-12:v))
      const d=solve(B,g.map(v=>-v))
      if(d){
        const q=p.map((v,j)=>v+d[j]),rq=R(q),sq=S(rq)
        if(isFinite(sq)&&sq<sse){
          const rel=(sse-sq)/(sse||1);p=q;r=rq;sse=sq;lam=Math.max(lam/3,1e-12);improved=true
          if(rel<1e-13)return{p,sse}
          break
        }
      }
      lam*=4
    }
    if(!improved)break
  }
  return{p,sse}
}

// ---------------------------------------------------------------- 공식 후보
/**
 * vars: [{id,name,cat,unit:'flat'|'pct',reduce:bool}], X: 행마다 vars 순서의 값, y: 결과
 * 반환: 후보마다 {name,desc,k,predict(x),formula,sse,...} (잘 맞는 순)
 */
/**
 * 공식 모양(spec) → 계산 함수 f(p, x). 찾은 공식을 저장했다가 최적화에서 다시 계산할 때 쓴다.
 * x 는 변수 값 배열, p 는 계수 배열.
 */
function makeF(sp){
  const sum=(idx,p,o,x,div=1)=>idx.reduce((s,i,j)=>s+p[o+j]*x[i]/div,0)
  switch(sp.type){
    case'lin':return(p,x)=>p[0]+x.reduce((s,v,i)=>s+p[i+1]*v,0)
    case'mul':return(p,x)=>(p[0]+sum(sp.F,p,1,x))*(1+sum(sp.P,p,1+sp.F.length,x,100))
    case'grp':return(p,x)=>{let m=p[0]+sum(sp.F,p,1,x),o=1+sp.F.length;for(const g of sp.g){m*=1+sum(g,p,o,x,100);o+=g.length}return m}
    case'pow':return(p,x)=>Math.exp(p[0]+x.reduce((s,v,i)=>s+p[i+1]*Math.log(v),0))
    case'red':return(p,x)=>{const K=p[p.length-1];return(p[0]+sum(sp.O,p,1,x))*K/(K+x[sp.d])}
    case'red6':return(p,x)=>{const K=p[p.length-1];return(p[0]+sum(sp.Fo,p,1,x))*(1+sum(sp.P,p,1+sp.Fo.length,x,100))*K/(K+x[sp.d])}
    case'atkdef':return(p,x)=>{const nF=sp.F.length;let a=p[0]+sum(sp.F,p,1,x);a=a*(1+p[1+nF]*x[sp.w]/100)-p[2+nF];let o=3+nF
      for(const g of sp.g){a*=1+sum(g,p,o,x,100);o+=g.length}return a}
    case'gp':{const fn=sp.noA?new Function('c','x',`return c[${sp.k}]*${sp.body}`):new Function('c','x',`return c[${sp.k}]+c[${sp.k+1}]*${sp.body}`);return fn}
  }
  return null
}
function fitModels(vars,X,y,tol){
  const n=y.length,out=[]
  const idx=f=>vars.map((v,i)=>f(v)?i:-1).filter(i=>i>=0)
  const N=i=>vars[i].name
  const lin=ols(X,y)
  const term=(a,i)=>(a<0?' − ':' + ')+coef(Math.abs(a))+'×'+N(i)
  const add=(name,desc,f,p,form,snap=true,spec=null)=>{
    const k=p.length
    if(n<=k)return out.push({name,desc,k,skip:`기록이 ${k+1}개 이상 필요 (지금 ${n}개)`})
    const pr=X.map(x=>f(p,x)),res=pr.map((v,i)=>v-y[i])
    if(res.some(v=>!isFinite(v)))return
    const sse=res.reduce((s,v)=>s+v*v,0)
    const m={name,desc,k,f,p,form,snap,spec,formula:pretty(form(p)),pr,res,sse};m.predict=x=>m.f(m.p,x)
    out.push(m)
  }
  const pc=i=>vars[i].name.includes('%')?'':'%'
  // 1) 합
  if(lin) add('합 (선형)','결과 = 상수 + 각 변수 × 계수',makeF({type:'lin'}),lin,
    p=>'결과 = '+coef(p[0])+vars.map((_,i)=>term(p[i+1],i)).join(''),true,{type:'lin'})
  const F=idx(v=>v.unit!=='pct'),P=idx(v=>v.unit==='pct'),D=idx(v=>v.reduce)
  const meanY=y.reduce((s,v)=>s+v,0)/n||1
  // 2) (고정 합) × (1 + % 합)
  if(P.length&&lin){
    const sp2={type:'mul',F,P},f=makeF(sp2)
    const p0=[lin[0],...F.map(i=>lin[i+1]),...P.map(i=>lin[i+1]*100/meanY)]
    const {p}=lm(f,p0,X,y)
    add('고정 합 × (1 + % 합)','고정값끼리 더한 뒤, %끼리 더한 배율을 한 번 곱함',f,p,
      p=>'결과 = ('+coef(p[0])+F.map((i,j)=>term(p[1+j],i)).join('')+') × (1'+P.map((i,j)=>term(p[1+F.length+j],i)+pc(i)).join('')+')',true,sp2)
    // 3) %를 묶어서 곱: 분류별 / 항목별 / 하나하나 (같은 묶음 안의 %는 더함)
    const seen=new Set([JSON.stringify([P])])
    const named=[
      ['분류별 곱','같은 분류(룬, 스킬 …)의 %는 더하고, 분류끼리는 곱함',i=>vars[i].cat||'(분류 없음)'],
      ['항목별 곱','같은 항목(공격력, 데미지 …)의 %는 분류가 달라도 더하고, 항목끼리는 곱함',i=>vars[i].item||vars[i].name],
      ['% 하나하나 곱','모든 %를 각각 따로 곱함',i=>vars[i].name]].map(([n,d,key])=>{const keys=[...new Set(P.map(key))];return[n,d,keys.map(k=>P.filter(i=>key(i)===k))]})
    // % 가 4개 이하면 묶는 방법을 전부 시험 (어떤 % 끼리 더해지고 어떤 것끼리 곱해지는지)
    const parts=[]
    if(P.length<=4){const rec=(k,acc)=>{if(k===P.length){parts.push(acc.map(g=>g.slice()));return}
        for(const g of acc){g.push(P[k]);rec(k+1,acc);g.pop()}acc.push([P[k]]);rec(k+1,acc);acc.pop()};rec(0,[])}
    const cands=[...named,...parts.map(g=>['묶음 곱','괄호 안의 %는 더하고, 괄호끼리는 곱함',g])]
    for(const [mname,mdesc,g] of cands){
      if(g.length<2)continue
      const sig=JSON.stringify(g);if(seen.has(sig))continue;seen.add(sig)
      const sp3={type:'grp',F,g},f3=makeF(sp3)
      const q0=[p[0],...F.map((_,j)=>p[1+j]),...g.flat().map(i=>p[1+F.length+P.indexOf(i)])]
      const r3=lm(f3,q0,X,y)
      add(mname,mdesc,f3,r3.p,q=>{
        let o=1+F.length
        const parts=g.map(grp=>{const s='(1'+grp.map((i,j)=>term(q[o+j],i)+pc(i)).join('')+')';o+=grp.length;return s})
        return '결과 = ('+coef(q[0])+F.map((i,j)=>term(q[1+j],i)).join('')+') × '+parts.join(' × ')},true,sp3)
    }
  }
  // 3-2) 공격 × (1 + 공격%) − 방어, 나머지 %는 의미별 묶음(타입 / 속성 / 피해)으로 곱 — 방어를 빼는 게임용
  if(P.length&&lin&&F.length){
    const Wc=P.filter(i=>/공격.*%|무기/.test(vars[i].name)).slice(0,2)
    for(const w of Wc){
      const rest=P.filter(i=>i!==w),key=i=>/타입/.test(vars[i].name)?'t':/속성/.test(vars[i].name)?'e':'d'
      const gs=[...new Set(rest.map(key))].map(k=>rest.filter(i=>key(i)===k))
      const sp7={type:'atkdef',F,w,g:gs},f7=makeF(sp7)
      const A0=X.map(x=>lin[0]+F.reduce((t,i)=>t+lin[i+1]*x[i],0)),AX=X.map((x,j)=>A0[j]*(1+x[w]/100)),mAX=AX.reduce((t,v)=>t+v,0)/n||1
      let best=null
      for(const fr of [0,0.3,0.5,0.7]){
        const q0=[lin[0],...F.map(i=>lin[i+1]),1,fr*mAX,...gs.flat().map(()=>0.5)]
        const r=lm(f7,q0,X,y);if(isFinite(r.sse)&&(!best||r.sse<best.sse))best=r}
      if(!best)continue
      add('공격 × (1 + 공격%) − 방어, 묶음 곱','공격 합에 공격 %를 곱하고 방어를 뺀 뒤, 타입·속성·피해 %는 묶음마다 더해서 곱함',f7,best.p,q=>{const nF=F.length;let o=3+nF
        const parts=gs.map(grp=>{const t='(1'+grp.map((i,j)=>term(q[o+j],i)+pc(i)).join('')+')';o+=grp.length;return t})
        return '결과 = (('+coef(q[0])+F.map((i,j)=>term(q[1+j],i)).join('')+') × (1'+term(q[1+nF],w)+pc(w)+') − '+coef(q[2+nF])+')'+(parts.length?' × '+parts.join(' × '):'')},true,sp7)
    }
  }
  // 4) 거듭제곱 (모두 곱): 값이 모두 양수일 때
  if(vars.length&&y.every(v=>v>0)&&X.every(r=>r.every(v=>v>0))){
    const l=ols(X.map(r=>r.map(Math.log)),y.map(Math.log))
    if(l){
      const f=makeF({type:'pow'})
      const {p}=lm(f,l,X,y)
      add('거듭제곱 (모두 곱)','결과 = 상수 × 변수1^a × 변수2^b …',f,p,
        p=>'결과 = '+coef(Math.exp(p[0]))+vars.map((_,i)=>' × '+N(i)+'^'+coef(p[i+1])).join(''),false,{type:'pow'})
    }
  }
  // 5) 감소형: (나머지) × K / (K + 방어)
  for(const d of D){
    const O=vars.map((_,i)=>i).filter(i=>i!==d)
    const lo=ols(X.map(r=>O.map(i=>r[i])),y);if(!lo)continue
    const md=X.reduce((s,r)=>s+Math.abs(r[d]),0)/n||1,mx=Math.max(...X.map(r=>Math.abs(r[d])))
    // K>0: 값이 클수록 줄어듦 (적 방어) / K<0: 값이 클수록 늘어남 (방깎: K/(K−x) 꼴)
    const Ks=[md*0.3,md,md*3,md*10,-(mx*1.5+md),-(mx*3+md*3),-(mx*10+md*10)]
    const sp5={type:'red',O,d},f=makeF(sp5)
    let best=null
    for(const K of Ks){

    add(`감소형 (${N(d)})`,`결과 = (나머지 합) × K / (K + ${N(d)})  · K 가 음수면 깎을수록 늘어나는 방깎 꼴`,f,best.p,p=>{const K=p[p.length-1]
      return '결과 = ('+coef(p[0])+O.map((i,j)=>term(p[1+j],i)).join('')+`) × ${coef(K)} / (${coef(K)} + ${N(d)})`},true,sp5)

/**

 * 하나씩 바꾸고 나머지를 다시 맞춰서, 여전히 모든 기록이 반올림 안에 들면 그 값으로 둔다.

function within(res,unit,tol){return res.every((r,i)=>Math.abs(r)<=Math.max(unit,tol&&tol[i]||0)*1.0000001+1e-9)}

      const free=[...Array(p.length).keys()].filter(i=>i!==j&&!fixed.has(i))
      const g=(r,x)=>{const z=q.slice();free.forEach((i,t)=>z[i]=r[t]);return m.f(z,x)}
      const r=free.length?lm(g,free.map(i=>q[i]),X,y,100).p:[]
      free.forEach((i,t)=>q[i]=r[t])

/** 보기 좋게: "0 + ", "1×", "+ 0×변수" 를 뺀다 */
function pretty(t){

  return t.replace(/ [+−] 0×(?:[^()+−]|\([^()]*\))*?(?= [+−] |\)|$)/g,'').replace(/ × \(1\)/g,'').replace(/\(0 [+] /g,'(').replace(/= 0 [+] /g,'= ').replace(/\(0 − /g,'(−').replace(/= 0 − /g,'= −')

/** 결과값이 몇 단위로 반올림돼 보이는지 (정수면 1, 소수 둘째 자리면 0.01) */

  let d=0

}
/** 다음에 뭘 찍어야 할지 */

    if(s.size<2)H.push(`'${v.name}'은(는) 한 번도 안 바뀌었어요. 이것만 바꿔서 2개 이상 기록하면 효과를 알 수 있어요.`)

  for(let a=0;a<vars.length;a++)for(let b=a+1;b<vars.length;b++){
    const r=corr(X.map(x=>x[a]),X.map(x=>x[b]))
    if(Math.abs(r)>0.98)H.push(`'${vars[a].name}'와(과) '${vars[b].name}'이(가) 항상 같이 바뀌어서 구분이 안 돼요. 둘 중 하나만 바꾼 기록이 필요해요.`)
  }
  const ok=models.filter(m=>!m.skip)
  const k=ok[0]?ok[0].k:vars.length+1
  if(n<2*k)H.push(`기록이 ${n}개예요. 후보끼리 확실히 가르려면 ${2*k}개 이상이 좋아요.`)
  if(ok.length>1&&n>0){
    const A=ok[0],B=ok[1]
    if(!(A.exact&&!B.exact)&&(B.score-A.score)<4){
      const last=X[n-1];let best=null
      vars.forEach((v,i)=>{
        const col=X.map(r=>r[i]),span=Math.max(...col)-Math.min(...col)
        const step=span>0?span:(Math.abs(last[i])*0.5||10)
        for(const s of [step,-step]){

    }
  }
  const top=ok[0]
  if(top&&!top.exact&&top.maxRel>0.01)H.push(`가장 잘 맞는 공식도 오차가 최대 ${fmt(top.maxRel*100,2)}%예요. 빠진 변수가 있거나, 입력 실수(표에서 노랗게 표시)일 수 있어요.`)

function corr(a,b){
  const n=a.length;if(n<3)return 0
  const ma=a.reduce((s,v)=>s+v,0)/n,mb=b.reduce((s,v)=>s+v,0)/n

  for(let i=0;i<n;i++){sab+=(a[i]-ma)*(b[i]-mb);saa+=(a[i]-ma)**2;sbb+=(b[i]-mb)**2}
  return saa&&sbb?sab/Math.sqrt(saa*sbb):0
}
/** "룬공격 +85000; 치명피해 -5, 공격력 =300" → [{name,op,val}] */
function parseChanges(s){
  return String(s||'').split(/[;\n,]+/).map(t=>t.trim()).filter(Boolean).map(t=>{
    const m=t.match(/^(.+?)\s*([+\-=])\s*([^+\-=]+)$/);if(!m)return null
    return{name:m[1].replace(/\s/g,''),op:m[2],val:num(m[3])}

function gpRand(nv,d){

function gpSize(n){return n.o==='v'||n.o==='c'?1:1+gpSize(n.a)+(n.b?gpSize(n.b):0)}

function gpReplace(root,ref,sub){if(!ref.par)return sub;ref.par[ref.key]=sub;return root}
function gpJs(n,cs){

    case'v':return`x[${n.i}]`
    case'c':cs.push(n.v);return`c[${cs.length-1}]`

  }
}
function gpSetConsts(n,p,st={k:0}){if(n.o==='c')n.v=p[st.k++];if(n.a)gpSetConsts(n.a,p,st);if(n.b)gpSetConsts(n.b,p,st);return n}
/** 보기 좋은 글자 (상수는 p 에서 앞에서부터 꺼내 씀) */
function gpStr(n,names,cs,prec=0){
  switch(n.o){
    case'v':return names[n.i]
    case'c':return coef(cs.shift())
    case'pct':return'(1 + '+(n.a.o==='v'?names[n.a.i]+(names[n.a.i].includes('%')?'':'%'):'('+gpStr(n.a,names,cs)+')/100')+')'

    default:{
      const P={'+':1,'-':1,'*':2,'/':2}[n.o]
      const a=gpStr(n.a,names,cs,P),b=gpStr(n.b,names,cs,P+(n.o==='-'||n.o==='/'?1:0))

function gpCompile(tree){

const gpHasV=n=>n.o==='v'||(n.a&&gpHasV(n.a))||(n.b&&gpHasV(n.b))

/** 맨 바깥이 '상수 ± (% 가 든 식)' 이면 버림: 안 바꾼 스펙을 % 곱셈 밖에서 더해 버리는 모양 */
function gpBadTop(t,vars){if(t.o!=='+'&&t.o!=='-')return false

/** 나무 하나의 상수를 맞추고 오차 계산. 같은 모양은 한 번만 */

function gpMutate(t,nv){

  if(r<0.45){
    if(n.o==='v')n.i=Math.floor(Math.random()*nv)
    else if(n.o==='c')n.v*=0.5+Math.random()
    else if(n.b)n.o=gpPick(GP_BIN)

  }
  if(r<0.55){
    // 비율 감소: x × m/(m + v)  (방어 감소에 흔한 모양)
    const v={o:'v',i:Math.floor(Math.random()*nv)},m=Math.random()<0.5?gpClone(n):{o:'c',v:gpPick([100,1000])}

  }
  if(r<0.8){
    const leaf=Math.random()<0.5?{o:'v',i:Math.floor(Math.random()*nv)}:{o:'*',a:{o:'c',v:1},b:{o:'v',i:Math.floor(Math.random()*nv)}}

/** 빠른 탐색의 틀들을 시작점으로 넣는다 (심도 탐색이 빠른 탐색보다 못하지 않게) */
function gpSeeds(vars){
  const V=i=>({o:'v',i}),sum=ids=>ids.map(V).reduce((a,b)=>({o:'+',a,b}))
  const wsum=ids=>ids.map(i=>({o:'*',a:{o:'c',v:1},b:V(i)})).reduce((a,b)=>({o:'+',a,b}))

  const cbases=F.length?[100,1e4,1e6,1e8].map(v=>({o:'+',a:{o:'c',v},b:sum(F)})):[cbase]
  if(F.length)S.push(...cbases)
  if(P.length){
    for(const b of [base,wbase,...cbases]){
      S.push({o:'*',a:b,b:{o:'pct',a:sum(P)}})
      S.push(P.reduce((t,i)=>({o:'*',a:t,b:{o:'pct',a:V(i)}}),b))
      // % 마다 계수 (그 묶음에 기록에 없는 %가 이미 있으면 1 + 계수×변화 로 보임)
      S.push(P.reduce((t,i)=>({o:'*',a:t,b:{o:'pct',a:{o:'*',a:{o:'c',v:0.5},b:V(i)}}}),b))

    }
  }

  }

}
/** 조금씩 나눠 돌리는 탐색기: step(ms) 를 여러 번 부르면 된다 (화면이 멈추지 않게) */
function gpEngine(vars,X,y,opt={}){
  const nv=vars.length,cache=new Map(),N=opt.pop||160
  // 변수가 많으면 빠른 탐색 모양(시작점)부터 크기 제한을 넘으니, 시작점 크기만큼은 허용
  const MAX=Math.max(opt.maxSize||25,...gpSeeds(vars).map(t=>gpSize(t)+4))
  const n=y.length,mean=y.reduce((s,v)=>s+v,0)/n,sd=Math.sqrt(y.reduce((s,v)=>s+(v-mean)**2,0)/n)||1
  const unit=roundUnit(y),floor=(unit/Math.sqrt(12))/sd*0.5
  const front=new Map()
  const score=e=>Math.log10(Math.max(e.errN,floor))+0.035*e.size
  const ev=t=>{
    if(gpSize(t)>MAX||gpBadTop(t,vars))return null
    const e=gpEval(t,X,y,cache,sd);if(!e)return null
    const f=front.get(e.size);if(!f||e.errN<f.errN)front.set(e.size,e)
    e.score=score(e);return e
  }
  const pending=gpSeeds(vars)
  let pop=[],next=null,gen=0
  const tourn=()=>{let b=null;for(let i=0;i<4;i++){const c=gpPick(pop);if(!b||c.score<b.score)b=c}return b}
  const elites=()=>[...pop].sort((a,b)=>a.score-b.score).slice(0,8)
  return{
    step(ms){
      const t0=Date.now();let guard=0
      while(Date.now()-t0<ms&&guard++<300){
        if(!next){
          const e=ev(pending.length?pending.shift():gpRand(nv,3));if(e)pop.push(e)
          if(pop.length>=N)next=elites()
          continue
        }
        const e=ev(Math.random()<0.4?gpCross(tourn().tree,tourn().tree):gpMutate(tourn().tree,nv))
        if(e)next.push(e)
        if(next.length>=N){pop=next;gen++;next=elites()}
      }
      return{gen,checked:cache.size}
    },
    /** 크기별 최선 중, 더 작은 것보다 오차가 줄어드는 것만 (복잡도-오차 경계) */
    front(){
      const out=[];let best=Infinity
      for(const e of [...front.values()].sort((a,b)=>a.size-b.size))if(e.errN<best*0.98){out.push(e);best=e.errN}

}
/** 심도 탐색 결과 하나를 빠른 탐색 결과와 같은 모양의 모델로 (정리·예측·표시에 같이 씀) */
function gpModel(e,vars,X,y,Xt,yt,quick,tol,tolT){
  const names=vars.map(v=>v.name),k=e.k
  const form=p=>{const cs=p.slice(0,k);return pretty('결과 = '+coef(p[k])+'×('+gpStr(e.tree,names,cs)+')')}
  const m={name:'크기 '+e.size,desc:'',k:e.k+1,size:e.size,f:e.fn,p:e.p.slice(),form,snap:true,predict:x=>e.fn(m.p,x),
    spec:{type:'gp',body:gpCompile(e.tree).body,k:e.k,noA:true}}
  m.formula=form(m.p)
  const unit=roundUnit(y)
  m.pr=X.map(x=>m.f(m.p,x));m.res=m.pr.map((v,i)=>v-y[i]);m.sse=m.res.reduce((s,v)=>s+v*v,0)
  m.rmse=Math.sqrt(m.sse/y.length);m.maxAbs=Math.max(...m.res.map(Math.abs))
  m.maxRel=Math.max(...m.res.map((v,i)=>Math.abs(v)/(Math.abs(y[i])||1)))
  m.exact=within(m.res,unit,tol)
  if(m.exact&&!quick)tidy(m,X,y,unit,tol)

    const r=Xt.map((x,i)=>m.f(m.p,x)-yt[i])
    m.testAbs=Math.max(...r.map(Math.abs));m.testRel=Math.max(...r.map((v,i)=>Math.abs(v)/(Math.abs(yt[i])||1)))
    m.testExact=within(r,roundUnit(yt),tolT)
  }
  return m
}

function equipNow(s,exclude){
  const e={...(s.equip0||{})}
  for(const r of s.records){if(r.id===exclude)continue
    if(r.equipSet){for(const k in e)delete e[k];Object.assign(e,r.equipSet)}
    for(const a of r.items||[])e[a.itemId]=Math.max(0,(e[a.itemId]||0)+a.act)}
  return e
}
/** 아이템 끼기/빼기 → 실제로 바뀌는 값들 (효과 중복 '하나만' 이면 0↔1 개일 때만) */
function itemChanges(it,act,had){
  if(it.dupEffect==='one'&&!((act>0&&had===0)||(act<0&&had===1)))return[]
  return(it.effects||[]).map(e=>{const p=e.vid.split(':'),n=num(e.val)
    return isFinite(n)&&n?{groupId:p[1],itemId:p[2]||null,unit:p[3]||'flat',change:n*act,from:it.id}:null}).filter(Boolean)
}

function hb(k){return`<button class="qm" data-help="${k}" title="설명">?</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-help]');if(!b)return
  const [t,body]=HELP[b.dataset.help]||['','']
  const m=document.createElement('div');m.className='hmask'
  m.innerHTML=`<div class="hbox"><h3>${t}</h3>${body}<div class="row" style="margin-top:14px"><button class="pri" style="flex:1">닫기</button></div></div>`
  m.onclick=ev=>{if(ev.target===m||ev.target.tagName==='BUTTON')m.remove()}
  document.body.append(m)})

function back(){if(nav.length>1){nav.pop();render();return true}return false}
window.onBack=()=>back()

$('#back').onclick=()=>back()

function buildSet(t,meta){const FL=gameFL(t),TV=measVars(t),fsel=(t.opt||{}).fsel||{},tv=tplVars(t),vm=t.vmeta||{}

  const ids=[...new Set(Object.values(forms).flatMap(f=>f.vars.map(v=>v.replace(/\*$/,''))).filter(v=>v.startsWith('g:')||v.startsWith('p:')))]
  if(t.useCrit!==false)for(const k of t.tm2?['g:crit:rate:pct']:['g:crit:rate:pct','g:crit:dmg:pct'])if(!ids.includes(k))ids.push(k)
  const PN={'p:elem:pct':['속성 강화 %','elem'],'p:elemS:pct':['상태창 속성 강화 %','elem'],'p:typeS:pct':['상태창 타입 강화 %','type'],'p:elemS:flat':['상태창 속성 강화','elem'],'p:elem:flat':['속성 강화','elem'],'p:type:pct':['타입 강화 %','type'],'p:type:flat':['타입 강화','type'],'p:atk':['소환수 공격','pet'],'p:def':['소환수 방어','pet'],'p:spd':['소환수 순발','pet'],'p:hp':['소환수 체력','pet'],'p:amp':['성장증폭 %','user'],'p:ratk':['소환수 실전투 공격','pet']}
  const inputs=ids.map(id=>{if(PN[id])return{id,name:PN[id][0],unit:id.endsWith(':pct')||id==='p:amp'?'pct':'flat',cap:null,scope:PN[id][1]}

    useCrit:t.useCrit!==false,measures:t.measures.map(m=>({id:m.id,name:m.name,basePct:num(m.basePct??m.pct)||100})),forms,inputs,runeMap:t.runeMap||{},runeTable:t.runeTable||{}}}

/** 공식 세트로 계산: 한 바퀴(또는 초당) 데미지. 결과는 비교(%)로만 씀 */
function setEval(S,st,cyc){
  const z={};for(const i of S.inputs){let v=num(st[i.id]);if(!isFinite(v))v=0;if(i.cap!=null&&v>i.cap)v=i.cap;z[i.id]=v;if(i.unit==='pct')z[i.id+'*']=v}
  const fOf=k=>{const f=S.forms[k];if(!f)return null;f.fn=f.fn||makeF(f.spec);return f}
  const val=(f)=>f.fn(f.p,f.vars.map(id=>z[id]??z[id.replace(/\*$/,'')]??0))
  const list=(cyc.list||[]).length?cyc.list:[{name:(S.measures[0]||{}).name,group:(S.measures[0]||{}).id,pct:'',count:'1',crit:'can'}]
  const p0=S.useCrit?Math.min(1,Math.max(0,(z['g:crit:rate:pct']||0)/100)):0,cm0=!S.useCrit?1:z['g:crit:dmg:pct']?z['g:crit:dmg:pct']/100:1,ovr=S.useCrit&&num(st.__cm)>1?num(st.__cm):0,cm=ovr||cm0
  const byTime=cyc.mode==='time',T=num(cyc.time)||10
  const kind=e=>byTime?(e.kind2||'count'):'count'
  const realCd=e=>(num(e.cd)||0)*(1-(num(e.cdr)||0)/100),realIv=e=>(num(e.iv)||0)/(1+(num(e.aspd)||0)/100)
  let usedT=0;for(const e of list)if(kind(e)==='cd'){const cd=realCd(e);if(cd>0)usedT+=T/cd*(num(e.cast)||0)}
  const leftT=Math.max(0,T-usedT);let tot=0,miss=0
  for(const e of list){const m=S.measures.find(x=>x.id===e.group)||S.measures[0];if(!m){miss++;continue}
    const N=fOf('m:'+m.id),C=fOf('c:'+m.id);if(!N&&!C){miss++;continue}
    const r=(num(e.pct)||100)/(m.basePct||100)
    const nd=N?val(N)*r:val(C)*r/cm,cd=ovr?nd*ovr:C?val(C)*r:nd*cm
    const p=Math.min(1,Math.max(0,p0+(num(e.critAdd)||0)/100)),md=S.useCrit?(e.crit||'can'):'none'
    const avg=md==='none'?nd:md==='always'?cd:nd*(1-p)+cd*p
    const k=kind(e),h=num(e.hits)||1
    const n=k==='cd'?(realCd(e)>0?T/realCd(e)*h:0):k==='fill'?(realIv(e)>0?leftT/realIv(e)*h:0):(num(e.count)||0)
    tot+=avg*n}
  return{r:byTime?tot/T:tot,miss}}

// TM2 덱: 속성·타입 목록 (게임 표기 '화염', 예전 자료의 '불' 도 화염으로)
const ELEMS=['화염','물','바람','빛','어둠'],TYPES=['야수','마법','자연','수중','던전','비행']
const normElem=e=>e==='불'?'화염':e
const scopeOf=(S,i)=>i.scope||'user'
const SCOPES=[['user','내 스펙 (공통)'],['elem','소환수 속성별'],['type','소환수 타입별'],['pet','소환수 자기 스펙']]
const curDeck=sp=>{const L=(sp&&sp.decks)||[];return L.find(d=>d.id===sp.deckId)||L[0]||null}
/** 소환수 한 마리의 입력값: 공통 + 그 속성·타입 강화 + 자기 스펙 */
function petState(S,st,p){const o={}
  for(const i of S.inputs){const sc=scopeOf(S,i)
    o[i.id]=sc==='elem'?st[i.id+'@'+normElem(p.elem)]:sc==='type'?st[i.id+'@'+p.type]:sc==='pet'?(p.st||{})[i.id]:st[i.id]}
  // 소환수마다 추가 치명 확률 (장착 스킬 등): 공통 치명 확률에 더함 (최대 100%는 계산에서 자름)
  const pc=num(p&&p.crit);if(pc&&S.inputs.some(i=>i.id==='g:crit:rate:pct'))o['g:crit:rate:pct']=(num(o['g:crit:rate:pct'])||0)+pc
  // 실제 비치명·치명 데미지를 적었으면 그 비율을 이 소환수의 치명 배율로 (그 상대 기준)

  if(S.inputs.some(i=>i.id==='p:amp')){const a=ampOf(st);if(isNum(a))o['p:amp']=a}

function petCritRatio(p){const a=num(p&&p.hitN),b=num(p&&p.hitC);return a>0&&b>a?b/a:null}
/** 내 스펙의 성장증폭 % (안 적었으면 앱 설정 값) */
const ampOf=st=>{const n=num((st||{})['p:amp']);return isFinite(n)?n:myAmp()}

function petBase(p){const b=p.base;if(b&&[0,1,2,3].every(i=>isNum(b[i])))return b
  const q=['p:atk','p:def','p:spd','p:hp'].map(k=>num((p.st||{})[k]));return q.every(isFinite)?q:null}
/** 실전투 공격 (캐릭터 배율 뺀 값) = 원래 능력치 + 내 스펙 성장증폭 (총능 1480~1920 밖이면 없음) */
function petReal(p,st){const b=petBase(p),a=ampOf(st),r=b&&isNum(a)?realAtk(b,a):NaN;if(isFinite(r))return r

function petCycle(S,p,g){const k=skOf(p),mana=num(k.mana)||0,per=num(k.per)||1,ref=num(k.refund)||0

/** 공격 속도(초당 공격)는 아직 정하지 않음 — 소환수끼리 빠르기는 도감 S 순발 비율 */

// ---------------------------------------------------------------- 룬 비교 (게임 위 [계산]에서 부름): 옛 룬 → 새 룬, 저장한 내 스펙·덱·공식 세트로 % 변화
/** 룬 옵션 이름 → 공식 세트의 받을 값 키 (속성·타입별은 @속성 / @타입 붙임). 못 찾으면 null */
function runeKey(S,label){const L=String(label).replace(/\s/g,'')
  const ins=S.inputs,nm=i=>i.name.replace(/\s/g,'').replace(/%$/,'')
  // 공식 세트를 만들 때 연구실에서 연결해 둔 것 먼저
  const rm=(S.runeMap||{})[label];if(rm==='skip')return null
  const byId=rm&&ins.find(i=>i.id===rm)
  const elem=ELEMS.find(e=>L.startsWith(e)||(e==='화염'&&L.startsWith('불'))),type=TYPES.find(t=>L.startsWith(t))
  if(byId){const sc=scopeOf(S,byId);return sc==='elem'&&elem?byId.id+'@'+elem:sc==='type'&&type?byId.id+'@'+type:sc==='user'?byId.id:null}
  if(/^모든속성/.test(L)){const i=ins.find(i=>scopeOf(S,i)==='user'&&/모든/.test(i.name));return i?i.id:null}
  if(elem&&/속성/.test(L)){const i=ins.find(i=>scopeOf(S,i)==='elem'&&!/^p:elemS/.test(i.id))||ins.find(i=>scopeOf(S,i)==='elem');return i?i.id+'@'+elem:null}
  if(type&&/타입/.test(L)){const i=ins.find(i=>scopeOf(S,i)==='type');return i?i.id+'@'+type:null}
  if(L==='공격력'){const i=ins.find(i=>scopeOf(S,i)==='user'&&i.unit==='flat'&&/공격/.test(i.name)&&!/장비/.test(i.name))||ins.find(i=>scopeOf(S,i)==='user'&&/공격/.test(i.name));return i?i.id:null}
  const i=ins.find(i=>scopeOf(S,i)==='user'&&(nm(i).includes(L)||L.includes(nm(i))));return i?i.id:null}
/** 만 단위 표시값 (lo~hi) → 수치 표(등급|옵션 → 레벨 → 값)로 추정, 없으면 범위 가운데 */
function runeNum(S,grade,label,level,n){if(!n)return{v:0,est:false};if(n.lo===n.hi)return{v:n.lo,est:false}
  const T=((S.runeTable||{})[grade+'|'+label])||{},pts=Object.entries(T).map(([k,v])=>[+k,+v]).filter(p=>isFinite(p[0])&&isFinite(p[1]))
  if(level!=null&&new Set(pts.map(p=>p[0])).size>=2){const mx=pts.reduce((a,p)=>a+p[0],0)/pts.length,my=pts.reduce((a,p)=>a+p[1],0)/pts.length
    const sxx=pts.reduce((a,p)=>a+(p[0]-mx)**2,0);if(sxx>0){const b=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/sxx;return{v:Math.min(n.hi,Math.max(n.lo,Math.round(my+b*(level-mx)))),est:true}}}
  return{v:Math.floor((n.lo+n.hi)/2),est:true}}
/** 게임 위에서 부르는 입구. a,b = {grade,name,level,atk:{lo,hi,pct},subs:[[label,{lo,hi,pct}]]} → 결과 JSON */
window.runeCompare=function(aJ,bJ){loadData()
  const a=typeof aJ==='string'?JSON.parse(aJ):aJ,b=typeof bJ==='string'?JSON.parse(bJ):bJ
  const S=activeSet();if(!S)return JSON.stringify({err:'공식 세트가 없어요. 앱 > 최적화에서 공식 세트를 불러오거나 만들어 주세요.'})
  const sp=data.spec||{},st=(sp.st)||{};if(!Object.keys(st).length)return JSON.stringify({err:'내 스펙이 비어 있어요. 앱 > 최적화 > 스펙 효율에서 내 스펙을 먼저 저장해 주세요.'})
  const deck=curDeck(sp),useDeck=deck&&deck.pets.length>0,g=deckGroups(S,sp),cyc=sp.cyc||{mode:'cycle',list:[]}
  const evalAll=s=>useDeck?deckEval(S,s,deck,g):setEval(S,s,cyc)
  const base=evalAll(st);if(!(base.r>0))return JSON.stringify({err:'지금 내 스펙으로 계산이 안 돼요. 앱 > 최적화에서 내 스펙을 확인해 주세요.'})
  const labels=[...new Set(['공격력',...(a.subs||[]).map(x=>x[0]),...(b.subs||[]).map(x=>x[0])])]
  const rows=[],s2={...st}
  for(const lab of labels){const na=lab==='공격력'?a.atk:((a.subs||[]).find(x=>x[0]===lab)||[])[1],nb=lab==='공격력'?b.atk:((b.subs||[]).find(x=>x[0]===lab)||[])[1]
    const va=runeNum(S,a.grade,lab,a.level,na),vb=runeNum(S,b.grade,lab,b.level,nb),k=runeKey(S,lab),pct=!!((na||nb||{}).pct)
    let why=''
    if(!k)why='계산 안 함'
    else if(useDeck&&k.includes('@')){const tag=k.split('@')[1];if(!deck.pets.some(p=>normElem(p.elem)===tag||p.type===tag))why=`덱에 ${tag} 없음`}
    else if(!useDeck&&k.includes('@'))why='덱이 없어서 계산 안 함'
    if(k&&!why)s2[k]=(num(s2[k])||0)+vb.v-va.v
    rows.push({label:lab,old:va.v,new:vb.v,d:vb.v-va.v,pct,est:va.est||vb.est,why})}
  const g2=(evalAll(s2).r/base.r-1)*100
  return JSON.stringify({set:S.name,deck:useDeck?deck.name:null,decks:(sp.decks||[]).map(d=>({id:d.id,name:d.name,n:d.pets.length})),deckId:deck&&deck.id,
    a:{name:a.name,grade:a.grade,level:a.level},b:{name:b.name,grade:b.grade,level:b.level},g:g2,rows})}
/** 게임 위 결과 창에서 덱 바꾸기 */

/** 예전 게임(직접 만든 틀)의 실험 → 테마 (기본) 복사본. 항목은 이름으로 맞춤, 못 맞춘 항목·아이템은 빠짐. 원본은 그대로 */
function tm2KeyFor(t,gid,iid,unit){const G=t.groups.find(g=>g.id===gid);if(!G)return null
  if(gid==='crit')return iid==='rate'||iid==='dmg'?'crit:'+iid+':pct':null
  const IT=iid?(G.items||[]).find(x=>x.id===iid):null,raw=IT?IT.name:G.name,rm=tm2Template().runeMap
  const N=x=>String(x).replace(/\s/g,'').replace(/^모두/,'모든')
  let k=rm[raw]||rm[N(raw)]||Object.entries(rm).find(([l])=>N(l)===N(raw))?.[1]||null
  if(!k||k==='skip'){const L=N(raw),gn=N(G.name)
    const e=TM2_ELEM.find(([,n])=>L===n||L===n+'속성'),ty=TM2_TYPE.find(([,n])=>L===n+'타입')
    k=/속성강화/.test(gn)&&e?'g:elv:'+e[0]+':flat':/모든능력치/.test(L)?'g:elv:all:flat':/파티피해증가/.test(L)?'g:buff:party:flat':/^무기/.test(gn)&&/^공격/.test(L)?'g:wpn:atkp:pct':/^기본/.test(gn)&&/^공격/.test(L)?'g:base:atk:flat':(k==='skip'?null:null)}
  if(!k)return null;k=k.replace(/^g:/,'');return k.endsWith(':'+unit)?k:null}
/** 옛 실험에서 쓰인 항목 키(분류:항목:단위) 목록 */
function usedKeys(s){const K=new Set(Object.keys(s.start||{}))
  for(const r of s.records){for(const ch of changesOf(r))if(!ch.from)K.add(ch.groupId+':'+(ch.itemId||'')+':'+(ch.unit||'flat'));for(const k in r.reset||{})K.add(k)}
  return[...K]}
function copyToTm2(s,M,MM){const t=tpl(s.templateId);if(!t)return null
  const miss=new Set(),mm={};for(const m of t.measures)mm[m.id]=MM&&m.id in MM?MM[m.id]:/스킬/.test(m.name)?'skill':'basic'
  const mapKey=(gid,iid,unit,label)=>{const ok=gid+':'+(iid||'')+':'+unit,k=M&&ok in M?M[ok]||null:tm2KeyFor(t,gid,iid,unit);if(!k)miss.add(label);return k}
  const nameOf=(gid,iid)=>{const G=t.groups.find(g=>g.id===gid),IT=G&&iid?(G.items||[]).find(x=>x.id===iid):null;return(G?G.name:'?')+(IT?' '+IT.name:'')}
  const remapM=o=>{if(!o)return o;const r={};for(const[k,v]of Object.entries(o))if(mm[k]&&!(mm[k]in r))r[mm[k]]=v;return r}
  const start={};for(const[k,v]of Object.entries(s.start||{})){const[g,i,u]=k.split(':');const nk=mapKey(g,i||null,u,nameOf(g,i));if(nk)start[nk]=v}
  const records=s.records.map(r=>{const changes=[]
    for(const ch of changesOf(r)){if(ch.from)continue;const nk=mapKey(ch.groupId,ch.itemId,ch.unit||'flat',nameOf(ch.groupId,ch.itemId));if(!nk)continue
      const[g,i,u]=nk.split(':');changes.push({groupId:g,itemId:i,unit:u,change:ch.change,once:!!ch.once})}
    if((r.items||[]).length)miss.add('아이템 끼기/빼기')
    const reset=r.reset?Object.fromEntries(Object.entries(r.reset).map(([k,v])=>{const[g,i,u]=k.split(':');return[mapKey(g,i||null,u,nameOf(g,i)),v]}).filter(([k])=>k)):undefined
    const f0=changes.find(q=>!q.once)||changes[0]
    const o={id:uid(),time:r.time,changes,items:[],values:remapM(r.values)||{},samples:remapM(r.samples)||{},critValues:remapM(r.critValues)||{},critSamples:remapM(r.critSamples)||{},
      skip:!!r.skip,note:r.note||'',groupId:f0?f0.groupId:null,itemId:f0?f0.itemId:null,change:f0?f0.change:0,unit:f0?f0.unit:'flat'}
    if(reset)o.reset=reset;if(r.pet)o.pet=r.pet;if(isNum(r.amp))o.amp=r.amp;return o})
  return{ses:{id:uid(),name:s.name+' (테마)',templateId:'tm2',created:Date.now(),records,start,pet0:s.pet0||null,amp0:isNum(s.amp0)?s.amp0:null},miss:[...miss]}}

      ${s.records.some(r=>(r.items||[]).length)?'<div class="mut bad" style="margin-top:6px">아이템 끼기/빼기는 테마 (기본)에 없어서 빠져요 (아이템이 바꾼 값도 빠짐).</div>':''}</div>

  v.querySelectorAll('[data-mk]').forEach(e=>e.onchange=()=>{c.M[keys[+e.dataset.mk]]=e.value;render()})
  v.querySelectorAll('[data-mm]').forEach(e=>e.onchange=()=>{c.MM[t.measures[+e.dataset.mm].id]=e.value})
  $('#mcx').onclick=()=>back()
  $('#mgo').onclick=()=>{const vals=Object.values(c.MM).filter(Boolean);if(new Set(vals).size<vals.length)return alert('평타·스킬에 같은 잰 값이 두 개 연결돼 있어요. 하나는 빼기로 해 주세요.')
    const R=copyToTm2(s,c.M,c.MM);mutate(d=>d.sessions.push(R.ses));LS.set('tmcalcLabGame','tm2');LS.set('tmcalcLabTab','exp')
    toast('복사했어요. 시작 상태에서 쓰는 소환수·성장증폭을 정해 주세요.');nav=[{v:'front'},{v:'home'},{v:'start',id:R.ses.id}];render()}
}

function importText(text){
  try{
    const o=JSON.parse(text)
    if(o.kind==='tmcalc-lab-template'&&o.template){
      // 같은 틀(같은 id)이 있으면 바꿔 끼울지 묻는다 (아이템 목록 주고받기)
      mutate(d=>{const i=d.templates.findIndex(t=>t.id===o.template.id)
        if(i<0)d.templates.push(o.template)
        else if(confirm(`'${d.templates[i].name}' 틀이 이미 있어요. 불러온 것으로 바꿀까요? (취소하면 새 틀로 추가)`))d.templates[i]=o.template
        else d.templates.push({...o.template,id:uid(),name:o.template.name+' (불러옴)'})})
      toast('틀을 불러왔어요.');nav=[{v:'front'},{v:'home'}];render();return
    }
    if(o.kind==='tmcalc-formula-set'&&o.forms){
      const S2={...o,id:uid()};mutate(d=>{d.formulaSets=d.formulaSets||[];d.formulaSets.push(S2);d.spec=d.spec||{};d.spec.setId=S2.id})
      toast(`공식 세트 '${o.name}'을(를) 불러왔어요.`);nav=[{v:'front'}];render();return}
    if(o.kind==='tmcalc-lab-list'&&o.list){const t=tpl(o.templateId)||curGame();if(!t)throw 0
      const ex=listsOf(t).find(l=>l.name===o.list.name),merge=ex&&confirm(`'${ex.name}' 목록이 이미 있어요. [확인] 합치기 (같은 이름은 바꿔 끼움) / [취소] 새 목록으로`)
      mutate(d=>{const T=d.templates.find(q=>q.id===t.id);if(merge){const X=ex.id==='main'?{items:T.items=T.items||[]}:T.lists.find(l=>l.id===ex.id)
          for(const it of o.list.items){const i=X.items.findIndex(x=>x.name===it.name);if(i>=0)X.items[i]={...it,id:X.items[i].id};else X.items.push({...it,id:uid()})}}
        else (T.lists=T.lists||[]).push({id:uid(),name:o.list.name+(ex?' (불러옴)':''),items:o.list.items.map(it=>({...it,id:uid()}))})})
      toast('목록을 불러왔어요.');render();return}
    if(o.kind!=='tmcalc-lab-session'||!o.session)throw 0
    let nid=null,tid=o.template&&o.template.id
    mutate(d=>{
      if(o.template&&!d.templates.some(t=>t.id===tid))d.templates.push(o.template)
      const s={...o.session,id:uid(),templateId:tid||o.session.templateId}
      if(d.sessions.some(q=>q.name===s.name))s.name+=' (불러옴)'
      d.sessions.push(s);nid=s.id;tid=s.templateId
    })
    const T=tpl(tid)
    if(T&&!T.tm2){toast('실험을 불러왔어요. 테마 (기본) 항목에 맞춰 옮겨 주세요.');LS.set('tmcalcLabGame',T.id);nav=[{v:'front'},{v:'home'},{v:'mapTm2',id:nid}];render();return}
    toast('세션을 불러왔어요.');nav=[{v:'front'},{v:'home'}];render()
  }catch(_){alert('연구실 파일(실험·게임·목록)이 아니에요.')}
}

function addSample(){
  // 실제 공식: 데미지 = (기본 1000 + 룬 고정) × (1 + 룬%) × (1 + 무기%)
  const g1=uid(),g2=uid(),m1=uid(),t={id:uid(),name:'예시 게임 데미지',groups:[{id:g1,name:'룬'},{id:g2,name:'무기'}],measures:[{id:m1,name:'일반공격'}]}
  const steps=[[null,0,'flat'],[g1,150,'flat'],[g1,200,'flat'],[g1,5,'pct'],[g1,10,'pct'],[g2,8,'pct'],[g2,12,'pct'],[g1,-100,'flat'],[g2,-5,'pct'],[g1,7,'pct'],[g1,300,'flat'],[g2,20,'pct']]
  let fl=0,rp=0,wp=0;const recs=[];let t0=Date.now()-steps.length*60000
  for(const [g,ch,u] of steps){if(g===g1&&u==='flat')fl+=ch;if(g===g1&&u==='pct')rp+=ch;if(g===g2)wp+=ch
    recs.push({id:uid(),time:t0+=60000,groupId:g,change:ch,unit:u,values:{[m1]:Math.round((1000+fl)*(1+rp/100)*(1+wp/100))},note:''})}
  mutate(d=>{d.templates.push(t);d.sessions.push({id:uid(),name:'예시: 룬·무기 실험',templateId:t.id,created:Date.now(),records:recs})})
}

        <label class="row mut" style="gap:4px"><input type="checkbox" data-ir="${i}:${j}"${it.reduce?' checked':''}>감소형</label>

    <button class="sm" id="ga">+ 분류</button>

      기록할 때 분류 → 항목 순서로 고르고, 공식 찾기에서는 '스킬 데미지 %', '스킬 공격력 %'처럼 따로 계산돼요.<br>
      같은 항목의 %가 분류가 달라도 합쳐지는지(항목별 곱), 분류마다 따로 곱해지는지(분류별 곱)도 시험해요.</div></details>

      · 적 방어, 받는 피해 감소, 저항: 높을수록 결과가 줄어들어요.<br>
      · 방깎(방어 감소): 깎을수록 결과가 늘어나요.<br>
      게임은 방어를 그냥 빼기보다 <b>비율로</b> 계산하는 경우가 많아요: 데미지 = 공격 × K / (K + 방어). (K=1000 이면 방어 1000일 때 절반)<br>

    t.name=t.name.trim();t.groups=t.groups.filter(g=>g.name.trim());t.groups.forEach(g=>g.items=(g.items||[]).filter(x=>x.name.trim()));t.measures=t.measures.filter(m=>m.name.trim())

// ---------------------------------------------------------------- ③ 아이템 목록 하나 (등록만)
const varName=(t,vid)=>{const x=tplVars(t).find(q=>q.id===vid);return x?x.name.replace(/ 변화$/,''):'(지운 값)'}
const effText=(t,it)=>{const f=e=>`${varName(t,e.vid)} ${num(e.val)>=0?'+':''}${e.val}`,es=(it.effects||[]).filter(e=>e.vid&&String(e.val).trim()!=='')
  const b=es.filter(e=>!e.r).map(f),r=es.filter(e=>e.r).map(f)
  return [b.length?'기본 '+b.join(' · '):'',r.length?'옵션 '+r.join(' · '):'',(it.rules||[]).length?`특수 ${it.rules.length}`:''].filter(Boolean).join('  |  ')||'효과 없음'}
function vItems(c,v){
  const t=tpl(c.id);if(!t)return back()
  const L=listOf(t,c.lid||'main');if(!L)return back()
  $('#title').textContent=t.name+' · '+L.name
  const slots=t.slots||[],sets=t.sets||[],orphan=L.items.filter(i=>!slots.some(q=>q.id===i.slotId))
  const row=it=>`<div class="list-row" data-it="${it.id}" style="cursor:pointer;border-bottom:1px solid var(--line);padding-bottom:6px"><div style="flex:1;min-width:0"><b>${esc(it.name||'(이름 없음)')}</b>${it.set?` <span class="tag">${esc((sets.find(s=>s.id===it.set)||{}).name||'')}</span>`:''} <span class="mut">${esc(it.owned??1)}개 보유${num(it.dupMax)>1?` · 같은 것 ${esc(it.dupMax)}개까지`:''}</span><div class="mut">${esc(effText(t,it))}</div></div><span class="mut">›</span></div>`
  v.innerHTML=`<div class="row"><button class="sm" id="lr">이름</button><button class="sm" id="lx">내보내기</button>${L.id==='main'?'':'<button class="sm danger" id="ld">목록 지우기</button>'}</div>
  ${slots.map(q=>`<h2>${esc(q.name)} <span class="mut">${q.mode==='cost'?`코스트 ${esc(q.max||'∞')}까지`:`최대 ${esc(q.max||'∞')}개`}</span><span class="sp"></span><button class="sm" data-add="${q.id}">+ 아이템</button></h2>
    <div class="card">${L.items.filter(i=>i.slotId===q.id).map(row).join('')||'<div class="mut">없음</div>'}</div>`).join('')||'<div class="card empty">칸이 없어요 — ⚙ 게임 설정에서 칸 종류부터 추가</div>'}
  ${orphan.length?`<h2>칸 없음 <span class="mut">눌러서 칸 고르기</span></h2><div class="card">${orphan.map(row).join('')}</div>`:''}
  ${slots.length?`<div class="card" style="background:var(--card2)"><div class="big">빠르게 여러 개 적기</div><div class="mut">한 줄에 하나: <code>이름 / 칸 / 옵션 값, 옵션 값</code> · 기본 스펙은 <code>/ 기본: 공격력 170</code><br>
    옵션 이름은 게임 설정의 값 이름 그대로 (예: <code>룬 공격력 % 8</code>, <code>룬 공격력 200</code>). 그 칸 옵션 규칙에 있는 것은 '옵션', 나머지는 '기본 스펙'. 1,000 처럼 쉼표 숫자 OK.</div>
    <textarea id="qt" rows="3" style="width:100%;margin-top:6px;font:inherit;background:var(--in);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px" placeholder="룬#4 / 룬 / 룬 공격력 % 8, 치명 피해 % 3"></textarea>
    <button class="sm pri" id="qa" style="margin-top:6px">추가</button></div>`:''}`
  $('#lr').onclick=()=>{const n=prompt('목록 이름',L.name);if(!n)return;mutate(d=>{const T=d.templates.find(q=>q.id===t.id);if(L.id==='main')T.mainListName=n.trim();else{const x=T.lists.find(l=>l.id===L.id);if(x)x.name=n.trim()}});render()}
  $('#lx').onclick=()=>saveJson('목록_'+fname(L.name)+'.json',{kind:'tmcalc-lab-list',exported:new Date().toISOString(),templateId:t.id,list:{name:L.name,items:L.items}})
  const ld=$('#ld');if(ld)ld.onclick=()=>{if(!confirm(`'${L.name}' 목록(아이템 ${L.items.length}개)을 지울까요?`))return
    mutate(d=>{const T=d.templates.find(q=>q.id===t.id);T.lists=(T.lists||[]).filter(l=>l.id!==L.id);if(T.opt&&T.opt.list===L.id){T.opt.list='main';T.opt.eq={};T.opt.ex={}}});back()}
  v.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>editItem2(t,L,{id:uid(),name:'',slotId:b.dataset.add,owned:'1',dupMax:'1',dupEffect:'all',effects:[],rules:[]},true))
  v.querySelectorAll('[data-it]').forEach(r=>r.onclick=()=>editItem2(t,L,L.items.find(i=>i.id===r.dataset.it),false))
  const qa=$('#qa');if(qa)qa.onclick=()=>{const tv=tplVars(t).map(x=>({...x,nm:x.name.replace(/ 변화$/,'')}));let ok=0;const errs=[],add=[]
    $('#qt').value.split('\n').forEach((line,li)=>{if(!line.trim())return;const [nm,sl,...rest]=line.split('/').map(s=>s.trim()),at=`${li+1}줄`
      if(!nm)return errs.push(`${at}: 이름 없음`)
      const q=slots.find(x=>x.name===sl);if(!q)return errs.push(`${at}: 칸 '${sl||''}' 없음 (있는 칸: ${slots.map(x=>x.name).join(', ')})`)
      const eff=[],bad=[],allow=q.allow||[]
      for(let seg of rest){let base=false;const mm=seg.match(/^기본\s*[:：]\s*(.*)$/);if(mm){base=true;seg=mm[1]}
        seg=seg.replace(/(\d),(?=\d{3}(?!\d))/g,'$1')
        for(const tk of seg.split(',').map(x=>x.trim()).filter(Boolean)){const m=tk.match(/^(.*?)\s*([+-]?\d+(?:\.\d+)?)\s*(%?)$/)
          if(!m||!m[1].trim()){bad.push(tk);continue}
          let n=m[1].trim();if(m[3]&&!/%$/.test(n))n+=' %'
          const x=tv.find(z=>z.nm===n)||tv.find(z=>z.nm.replace(/\s/g,'')===n.replace(/\s/g,''));if(!x){bad.push(tk+' (값 이름 없음)');continue}
          const isR=!base&&allow.some(a=>a.vid===x.id)
          if(isR&&eff.filter(e=>e.r).length>=(num(q.optMax)||0)){bad.push(tk+' (옵션 칸 초과)');continue}
          if(isR&&q.noDup&&eff.some(e=>e.r&&e.vid===x.id)){bad.push(tk+' (같은 옵션 중복)');continue}
          eff.push({vid:x.id,val:m[2],r:isR?1:0})}}
      if(bad.length)errs.push(`${at}: 못 읽음 — ${bad.join(', ')}`)
      add.push({id:uid(),name:nm,slotId:q.id,owned:'1',dupMax:'1',dupEffect:'all',effects:eff,rules:[]});ok++})
    if(add.length)mutList(t.id,L.id,X=>X.items.push(...add))
    alert(`${ok}개 추가했어요.`+(errs.length?`\n\n확인 필요:\n${errs.join('\n')}`:''));render()}
}
/** 아이템 고치기 창: 기본 스펙(제한 없음) + 옵션(칸 옵션 규칙 안에서) */
function editItem2(t,L,it,isNew){
  const tv=tplVars(t),slots=t.slots||[],sets=t.sets||[],d=JSON.parse(JSON.stringify(it));d.effects=d.effects||[];d.rules=d.rules||[]
  const m=document.createElement('div');m.className='hmask'
  const slotOf=()=>slots.find(q=>q.id===d.slotId)||{allow:[],optMax:0,mode:'count'}
  const vsel=(sel,list,k)=>`<select data-eo="${k}" style="flex:1">${list.map(x=>`<option value="${x.id}"${x.id===sel?' selected':''}>${esc(x.name.replace(/ 변화$/,''))}</option>`).join('')}</select>`
  const row=(e,k,list)=>`<div class="list-row">${vsel(e.vid,list,k)}<input type="text" data-ev="${k}" value="${esc(e.val??'')}" placeholder="+10" style="width:80px"><button class="sm danger" data-ed="${k}">✕</button></div>`
  const body=()=>{const q=slotOf(),allowIds=(q.allow||[]).map(a=>a.vid),allowed=tv.filter(x=>allowIds.includes(x.id)),nr=d.effects.filter(e=>e.r).length,om=num(q.optMax)||0
    return`<div class="mut" style="margin-top:12px"><b>기본 스펙</b> (원래 붙어 있는 고정 효과 · 제한 없음). 데미지와 상관없는 효과(체력 등)는 안 적어도 됨.</div>
    ${d.effects.map((e,k)=>e.r?'':row(e,k,tv)).join('')}<button class="sm ghost" data-addb>+ 기본 효과</button>
    ${om||nr?`<div class="mut" style="margin-top:12px"><b>옵션</b> <span class="${nr>om?'bad':''}">${nr}/${om}개${nr>om?' ⚠ 초과':''}</span> · 랜덤으로 붙고 다시 돌릴 수 있는 것 (이 칸 옵션 규칙 안에서)</div>
      ${d.effects.map((e,k)=>e.r?row(e,k,allowed.concat(tv.filter(x=>x.id===e.vid&&!allowIds.includes(x.id)))):'').join('')}
      ${nr<om&&allowed.length?'<button class="sm ghost" data-addr>+ 옵션</button>':''}`:'<div class="mut" style="margin-top:12px">이 칸은 붙는 옵션 없음 (⚙ 게임 설정 › 칸 › 옵션 규칙)</div>'}
    <div class="mut" style="margin-top:12px">특수 능력 (선택) ${hb('itemRule')}</div>
    ${d.rules.map((r,k)=>`<div class="list-row"><select data-rt="${k}" style="flex:1">${tv.map(x=>`<option value="${x.id}"${x.id===r.target?' selected':''}>${esc(x.name)}</option>`).join('')}</select><select data-ro="${k}"><option${(r.op||'+')==='+'?' selected':''}>+</option><option${r.op==='='?' selected':''}>=</option></select><input type="text" data-rx="${k}" value="${esc(r.expr||'')}" placeholder="[마력] * 0.1" style="flex:1"><button class="sm danger" data-rd="${k}">✕</button></div>`).join('')}
    <button class="sm ghost" data-addu>+ 특수 능력</button>`}
  m.innerHTML=`<div class="hbox"><h3>${isNew?'아이템 추가':'아이템 고치기'}</h3>
    <label class="f">이름<input type="text" id="in" value="${esc(d.name)}" placeholder="전설 반지, 룬#3 …"></label>
    <div class="grid" style="margin-top:8px"><label class="f">칸<select id="is">${slots.find(q=>q.id===d.slotId)?'':'<option value="">(칸 고르기)</option>'}${slots.map(q=>`<option value="${q.id}"${q.id===d.slotId?' selected':''}>${esc(q.name)}</option>`).join('')}</select></label>
      <label class="f">가진 개수 (0 = 아직 없음)<input type="text" id="io" value="${esc(d.owned??'1')}"></label>
      <label class="f">같은 것 최대 착용<input type="text" id="idm" value="${esc(d.dupMax??'1')}"></label>
      <label class="f" id="icl">코스트<input type="text" id="ico" value="${esc(d.cost??'1')}"></label>
      <label class="f">효과 중복<select id="ide"><option value="all"${d.dupEffect!=='one'?' selected':''}>둘 다 적용</option><option value="one"${d.dupEffect==='one'?' selected':''}>하나만 적용</option></select></label>
      <label class="f">세트<select id="iset"><option value="">없음</option>${sets.map(s=>`<option value="${s.id}"${d.set===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select></label></div>
    <label class="row mut" style="gap:4px;margin-top:6px"><input type="checkbox" id="icd"${d.cond?' checked':''}>조건이 있어야 켜지는 특수 능력 (최적화에서 켬/끔)</label>
    <div id="er"></div>
    <div class="row" style="margin-top:14px"><button class="pri" id="sok" style="flex:1">저장</button><button id="scl">닫기</button>${isNew?'':'<button class="danger" id="sdl">지우기</button>'}</div></div>`
  const $m=s=>m.querySelector(s)
  const sync=()=>{m.querySelectorAll('[data-eo]').forEach(s=>{const k=+s.dataset.eo;d.effects[k].vid=s.value;d.effects[k].val=$m(`[data-ev="${k}"]`).value})
    m.querySelectorAll('[data-rt]').forEach(s=>{const k=+s.dataset.rt;d.rules[k]={target:s.value,op:$m(`[data-ro="${k}"]`).value,expr:$m(`[data-rx="${k}"]`).value}})}
  const redraw=()=>{$m('#er').innerHTML=body();$m('#icl').style.display=slotOf().mode==='cost'?'':'none';bind()}
  const bind=()=>{m.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{sync();d.effects.splice(+b.dataset.ed,1);redraw()})
    m.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{sync();d.rules.splice(+b.dataset.rd,1);redraw()})
    const ab=$m('[data-addb]');if(ab)ab.onclick=()=>{sync();d.effects.push({vid:(tv[0]||{}).id,val:'',r:0});redraw()}
    const ar=$m('[data-addr]');if(ar)ar.onclick=()=>{sync();const q=slotOf(),a=(q.allow||[]).find(x=>!q.noDup||!d.effects.some(e=>e.r&&e.vid===x.vid))||q.allow[0];d.effects.push({vid:a.vid,val:'',r:1});redraw()}
    const au=$m('[data-addu]');if(au)au.onclick=()=>{sync();d.rules.push({target:(tv[0]||{}).id,op:'+',expr:''});redraw()}
    m.querySelectorAll('[data-help]').forEach(b=>b.onclick=()=>showHelp(b.dataset.help))}
  $m('#is').onchange=e=>{sync();d.slotId=e.target.value;const q=slotOf(),bad=d.effects.filter(x=>x.r&&!(q.allow||[]).some(a=>a.vid===x.vid))
    if(bad.length){if(confirm(`새 칸 옵션 규칙에 없는 옵션 ${bad.length}개 (${bad.map(x=>varName(t,x.vid)).join(', ')})\n[확인] 기본 스펙으로 옮기기 / [취소] 지우기`))bad.forEach(x=>x.r=0);else d.effects=d.effects.filter(x=>!bad.includes(x))}
    redraw()}
  $m('#scl').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()}
  $m('#sok').onclick=()=>{sync();const q=slotOf(),nr=d.effects.filter(e=>e.r).length
    if(!slots.some(x=>x.id===d.slotId))return alert('칸을 골라 주세요.')
    if(nr>(num(q.optMax)||0))return alert(`옵션이 ${nr}개 — 이 칸은 최대 ${num(q.optMax)||0}개예요. 옵션을 지우고 저장하세요.`)
    if(q.noDup){const ids=d.effects.filter(e=>e.r).map(e=>e.vid);if(new Set(ids).size<ids.length)return alert('이 칸은 같은 옵션을 중복으로 못 붙여요.')}
    d.name=$m('#in').value.trim();d.owned=$m('#io').value.trim()||'1';d.dupMax=$m('#idm').value.trim()||'1';d.cost=$m('#ico').value.trim();d.dupEffect=$m('#ide').value;d.set=$m('#iset').value||null;d.cond=$m('#icd').checked
    d.effects=d.effects.filter(e=>e.vid);d.rules=d.rules.filter(r=>r.target&&String(r.expr).trim())
    mutList(t.id,L.id,X=>{const i=X.items.findIndex(x=>x.id===d.id);if(i>=0)X.items[i]=d;else X.items.push(d)});m.remove();render()}
  const dl=$m('#sdl');if(dl)dl.onclick=()=>{if(!confirm(`'${d.name||'이 아이템'}'을 지울까요?`))return;mutList(t.id,L.id,X=>X.items.splice(X.items.findIndex(x=>x.id===d.id),1));m.remove();render()}
  document.body.append(m);redraw()
}

// ---------------------------------------------------------------- ⚙ 게임 설정: 분류·공격 그룹(틀 수정) + 칸·옵션 규칙 + 세트 + 상태창 규칙
function vGset(c,v){
  const t=tpl(c.id);if(!t)return back()
  $('#title').textContent=t.name+' · 게임 설정'
  const tv=tplVars(t),slots=t.slots||[],sets=t.sets||[],vm=t.vmeta||{}
  const used=new Set();for(const s of data.sessions)if(s.templateId===t.id){for(const r of s.records)for(const ch of changesOf(r))used.add(vkey(ch));for(const k in s.start||{})used.add('g:'+k)}
  for(const l of listsOf(t))for(const it of l.items)for(const e of it.effects||[])used.add(e.vid)
  const showAll=!!c.all,vlist=tv.filter(x=>showAll||used.has(x.id)||vm[x.id])
  const vn=x=>esc(x.name.replace(/ 변화$/,''))

// ---------------------------------------------------------------- 시작 상태: 세션을 시작할 때 이미 붙어 있던 양
/** 시작 상태 칸 목록: 분류(항목) × 값/% → key "분류id:항목id:flat|pct" */
function startSlots(t){
  const out=[]
  for(const g of t.groups){
    const its=(g.items||[]).length?g.items:[null]
    for(const it of its){if(g.id==='crit'&&it&&(it.id==='rate'||(t.tm2&&it.id==='dmg')))continue   // 치명 확률은 최적화에서, 테마 기본 치명 피해는 소환수마다 달라 못 적음 (치명 기록으로 따로 계산)
      out.push({label:g.id==='crit'&&it&&it.id==='dmg'?'치명 피해 (1.5배 = 150)':g.name+(it?' '+it.name:''),short:g.id==='crit'&&it&&it.id==='dmg'?'치명 피해 (1.5배 = 150)':(it?it.name:g.name),group:g.name,key:g.id+':'+(it?it.id:'')})}
  }
  return out
}
function vStart(c,v){
  const s=ses(c.id);if(!s)return back()
  const t=tpl(s.templateId)||{groups:[]}
  // 다시 적기: 지금(마지막 기록 기준) 값을 보여 주고, 저장하면 '상태 다시 적기' 기록이 추가된다

  const st=c.reset?Object.fromEntries(Object.entries(lastV).filter(([k])=>k.startsWith('g:')&&!k.endsWith('*')).map(([k,v])=>[k.slice(2),v])):(s.start||{})
  const eqShow=c.reset?equipNow(s):(s.equip0||{})
  $('#title').textContent=s.name+(c.reset?' · 상태 다시 적기':' · 시작 상태')
  const sl=startSlots(t)
  v.innerHTML=`<div class="card"><div class="big">${c.reset?'지금 상태 다시 적기':'실험을 시작할 때 이미 붙어 있던 양'} ${hb(c.reset?'resetState':'startState')}</div>
    ${c.reset?'<div class="mut">예전 셋팅을 똑같이 맞추기 어려울 때 써요. 지금 상태창 값과 낀 아이템을 그대로 적으면, 이 시점부터 기준이 다시 잡혀요. (지금 칸에는 기록으로 계산한 값이 들어 있어요. 다른 칸만 고치세요)</div>':''}
    <div class="mut">상태창 등에서 보이는 지금 값을 적어요. 모르는 칸은 비워 두면 그 항목은 바꾼 양(변화량)만으로 계산해요.<br>
    적어 두면 공식 찾기가 실제 총량으로 계산해서 계수가 깔끔해지고, 합연산/곱연산도 더 정확히 가려요.</div>
    ${c.fresh?'<div class="mut good" style="margin-top:6px">세션을 만들었어요. 시작 상태를 적고 저장하세요 (나중에 해도 돼요).</div>':''}
    ${sl.length?`<input type="search" id="stq" placeholder="항목 검색 (예: 화염, 피해)" style="width:100%;margin-top:10px">
      <div class="scroll" style="margin-top:6px"><table id="stt"><tr><th class="l">항목</th><th>값 (+공격력 등)</th><th>%</th></tr>
      ${sl.map((x,i)=>`${i===0||sl[i-1].group!==x.group?`<tr class="stg" data-g="${esc(x.group)}"><td class="l" colspan="3" style="padding-top:10px"><b>${esc(x.group)}</b></td></tr>`:''}<tr data-sr="${esc(x.group+' '+x.short)}" data-g="${esc(x.group)}"><td class="l" style="padding-left:14px">${esc(x.short)}</td>
        ${['flat','pct'].map(u=>unitsOf(unitOfGI(t,...x.key.split(':'))).includes(u)?`<td><input type="text" inputmode="decimal" data-sk="${x.key}:${u}" value="${isFinite(st[x.key+':'+u])?st[x.key+':'+u]:''}" style="width:${u==='flat'?110:80}px;text-align:right" placeholder="모름"></td>`:'<td class="mut">-</td>').join('')}</tr>`).join('')}

function recText(t,r){

/** 잴 것 → 공식 찾기 대상: 일반(m:)·치명(c:) */
function measVars(t){
  const out=[]
  for(const m of t.measures){const crit=t.useCrit!==false
    out.push({id:'m:'+m.id,mid:m.id,kind:'m',name:m.name+(crit?' (비치명)':''),cat:'잰 값',unit:'flat'})
    if(crit)out.push({id:'c:'+m.id,mid:m.id,kind:'c',name:m.name+' (치명)',cat:'잰 값',unit:'flat'})}

/** 추천 공식에 어떤 옵션이 영향을 주는지: 영향 있음 / 없음 / 이번 계산에서 뺌 / 아직 안 재 봄 */
function influenceCard(m,R,c){
  const s=ses(c.id);if(!s)return''
  const t=tpl(s.templateId)||{groups:[],measures:[]},P=R.P,X=m.X||P.X,vars=m.vars||P.vars,last=X[X.length-1]
  if(!last)return''

    const z=last.slice();z[i]+=span;const d=Math.abs(m.predict(z)-base)
    ;(d>Math.max(unit*2,Math.abs(base)*0.001)?inc:none).add(x.name.replace(/\(곱\)$/,''))})
  const D=sessionData(s),usedIds=new Set(P.vars.map(x=>x.id.replace(/\*$/,'')))

  const untested=[...new Set(tplVars(t).filter(x=>!x.id.startsWith('g:crit:rate')&&!seen.has(x.id.replace(/:(flat|pct)$/,''))).map(x=>x.name.replace(/ (변화|%)$/,'')))]
  const line=(cls,label,L)=>L.length?`<div class="${cls}" style="margin-top:4px">${label}: ${L.map(esc).join(', ')}</div>`:''
  return`<div class="card" style="background:var(--card2);margin:8px 0"><div class="big">옵션 영향 ${hb('influence')}</div>
    ${line('good','✓ 영향 있음',[...inc])}${line('mut','○ 영향 없음 (바꿔 봤지만 이 데미지는 그대로)',[...none])}
    ${line('mut','− 이번 계산에서 뺌',off)}${line('bad','? 아직 안 재 봄 → 바꿔 가며 기록해 보세요',untested)}
    ${!untested.length&&!off.length?'<div class="mut" style="margin-top:4px">틀에 있는 옵션은 모두 확인했어요.</div>':''}</div>`
}
/** 측정 현황: 틀의 분류·항목(값/%)과 아이템마다 얼마나 측정했는지, 뭐가 더 필요한지 */
/** 테마 실험 순서: 바로 앞 기록과 비교해 그것 '하나만' 바뀐 기록 수·크기 종류 (소환수 바꾸기는 능력치·속성·타입을 묶어 하나로) */
const TM2_STEPS=[['g:rune:atk:flat','룬 공격'],['g:rune:dmg:pct','룬 피해증가'],['g:rune:cd:pct','룬 치명타 피해'],['g:rune:nb:pct','룬 일반공격피해'],['g:rune:sk:pct','룬 스킬공격피해'],
  ['p:elem:pct','룬 속성 강화 (소환수 속성)'],['p:type:pct','룬 타입 강화 (소환수 타입)'],['g:rune:ae:pct','룬 모든속성 강화'],['g:rune:at:pct','룬 모든타입 강화'],
  ['p:elemS:pct','상태창 속성 강화 % (소환수 속성)'],['p:typeS:pct','상태창 타입 강화 % (소환수 타입)'],['g:elv:all:flat','모든능력치'],['g:wpn:atkp:pct','무기 공격 %'],['g:buff:party:flat','파티 피해 증가'],['g:base:atk:flat','기본 공격력'],
  ['pet','소환수 바꾸기 (능력치 다른 소환수)'],['p:amp','성장증폭']]
function stepStatus(s){const D=sessionData(s),st={},PET=/^p:(atk|def|spd|hp|elem|type)/
  const rows=D.rows.filter(r=>!r.r.skip),ids=D.gvars.map(x=>x.id).filter(id=>id!=='p:ratk')
  for(let i=1;i<rows.length;i++){const a=rows[i-1].v,b=rows[i].v,same=(x,y)=>(isNaN(x)&&isNaN(y))||x===y
    let ch=ids.filter(id=>!same(a[id],b[id]))
    if(ch.some(id=>/^p:(atk|def|spd|hp)$/.test(id)))ch=['pet',...ch.filter(id=>!PET.test(id))]
    if(ch.length!==1)continue;const k=ch[0],o=st[k]=st[k]||{n:0,sizes:new Set()};o.n++;o.sizes.add(k==='pet'?rows[i].r.id:Math.round(Math.abs((b[k]||0)-(a[k]||0))*1000)/1000)}
  const have=new Set(ids)
  return TM2_STEPS.map(([id,name])=>{const o=st[id]||{n:0,sizes:new Set()},z=o.sizes.size,isP=id==='pet'
    const k=!o.n?'none':(isP?o.n>=2:z>=3)?'ok':'part'
    return{name,n:o.n,sizes:z,k,need:!o.n?(have.has(id)||isP?'이것만 바꾼 기록이 아직 없어요':'아직 안 바꿈: 이것만 바꿔서 기록'):k==='ok'?'충분해요':isP?'다른 소환수로 한 번 더':`크기 ${3-z}가지 더`}})}
function measureStatus(s,t){
  const out=[],tv=tplVars(t),stat={}
  for(const r of s.records)for(const ch of changesOf(r)){if(!ch.change)continue;const k=vkey(ch);const o=stat[k]=stat[k]||{n:0,sizes:new Set()};o.n++;o.sizes.add(Math.abs(ch.change))}
  // 겹침: 같은 항목이 0이 아닌 상태에서 또 바뀐 적
  const acc={},stacked=new Set()
  for(const x of tv){const s0=(s.start||{})[x.id.slice(2)];if(isFinite(s0))acc[x.id]=s0}
  for(const r of s.records){for(const [k,v] of Object.entries(r.reset||{}))acc['g:'+k]=v
    for(const ch of changesOf(r)){if(!ch.change||ch.once)continue;const k=vkey(ch);if(acc[k])stacked.add(k);acc[k]=(acc[k]||0)+ch.change}}
  for(const x of tv){const o=stat[x.id];if(x.id.startsWith('g:crit:')&&!o)continue;if(!o&&x.unit==='flat'&&tv.some(q=>q.id===x.id.replace(/flat$/,'pct')&&stat[q.id]))continue   // %만 쓰는 항목은 값 줄 생략
    if(!o&&x.unit==='pct'&&tv.some(q=>q.id===x.id.replace(/pct$/,'flat')&&stat[q.id]))continue
    const n=o?o.n:0,sizes=o?o.sizes.size:0,st=stacked.has(x.id),need=[]
    if(!n)need.push('한 번도 안 바꿈: 이것만 바꿔서 기록')
    else{if(sizes<3)need.push(`크기 ${3-sizes}가지 더 (예: 다른 크기로)`);if(x.unit==='pct'&&!st)need.push('겹쳐서 한 번 (합/곱 확인)')}
    out.push({name:x.name.replace(/ 변화$/,' (값)'),n,sizes,stack:st,k:!n?'none':need.length?'part':'ok',need:need.join(' · ')||'충분해요'})}
  const tested=new Set(s.records.flatMap(r=>(r.items||[]).map(a=>a.itemId)))
  for(const it of t.items||[])out.push({name:'[아이템] '+it.name,n:s.records.filter(r=>(r.items||[]).some(a=>a.itemId===it.id)).length,sizes:'',stack:false,
    k:tested.has(it.id)?'ok':'none',need:tested.has(it.id)?'충분해요':'한 번 껴 보거나 빼 보고 기록 (적어 둔 효과가 맞는지 확인)'})
  return out
}

// ---------------------------------------------------------------- 공식 찾기
/** 세션 기록 → 변수(분류별 누적 변화량, 잰 값)와 결과 */
/** 테마: 상태창 속성 강화(분류 elv)는 룬 속성 강화와 다른 변수로 (둘 다 %라 섞이지 않게) */
function elvTag(t,g,tag){if(!(t&&t.tm2&&tag))return tag;if(g==='elv'&&tag.k==='elem')return{k:'elemS',v:tag.v};if(g==='tlv'&&tag.k==='type')return{k:'typeS',v:tag.v};return tag}
function sessionData(s){
  const t=tpl(s.templateId)||{groups:[],measures:[]}
  const gname=id=>(t.groups.find(g=>g.id===id)||{name:'(지운 분류)'}).name
  const iname=(gid,iid)=>{const G=t.groups.find(g=>g.id===gid),it=G&&(G.items||[]).find(x=>x.id===iid);return it?it.name:'(지운 항목)'}
  const keys=[],stack={};let gvars
  for(const r of s.records){for(const ch of changesOf(r))if(ch.change){const k=vkey(ch).slice(2);if(!keys.includes(k))keys.push(k);stack[k]=(stack[k]||0)+1}
    for(const k in r.reset||{})if(!keys.includes(k))keys.push(k)}
  // 시작 상태에 적은 값은 기록에서 안 바뀌어도 상태에 넣는다 (치명 피해 등)
  for(const k in s.start||{})if(isFinite(s.start[k])&&!keys.includes(k))keys.push(k)
  gvars=keys.map(k=>{const [g,i,u]=k.split(':'),G=t.groups.find(x=>x.id===g),it=i?iname(g,i):null
    const IT=i&&G?(G.items||[]).find(x=>x.id===i):null
    const known=isFinite((s.start||{})[k])
    return{id:'g:'+k,name:gname(g)+(it?' '+it:'')+(u==='pct'?' %':(known?'':' 변화')),cat:gname(g),item:it,unit:u,reduce:IT?!!IT.reduce:!!(G&&G.reduce),stack:stack[k],known,tag:elvTag(t,g,itemTag(it||gname(g))||(it?itemTag(it+gname(g)):null))}})
  // 소환수를 정한 실험: 속성·타입 강화는 그 소환수에 맞는 것만 '적용 속성/타입 강화'로 (나머지는 데미지와 무관), 원래 능력치·성장증폭도 변수로
  const pets=[s.pet0,...s.records.map(r=>r.pet)].filter(Boolean),hasPet=pets.length>0
  const allG=gvars,tagged=hasPet?allG.filter(x=>x.tag):[]
  if(hasPet)gvars=allG.filter(x=>!x.tag)
  const pvars=[]
  for(const k of ['elem','elemS','type','typeS'])for(const u of ['flat','pct']){const L=tagged.filter(x=>x.tag.k===k&&x.unit===u);if(!L.length)continue
    pvars.push({id:'p:'+k+':'+u,name:({elem:'속성 강화 (룬·코스튬 등)',elemS:'상태창 속성 강화',type:'타입 강화 (룬·코스튬 등)',typeS:'상태창 타입 강화'}[k])+(u==='pct'?' %':'')+' (소환수 '+(k.startsWith('type')?'타입':'속성')+')',cat:'소환수',unit:u,stack:Math.max(0,...L.map(x=>x.stack||0)),known:L.every(x=>x.known),pk:k})}
  PSTAT.forEach(([k,l],i)=>{if(pets.some(p=>isNum((p.st||[])[i])))pvars.push({id:'p:'+k,name:'소환수 '+l,cat:'소환수',unit:'flat',known:true,pi:i})})
  const hasAmp=isNum(s.amp0)||s.records.some(r=>isNum(r.amp))||pets.some(p=>isNum(p.amp))
  if(hasAmp)pvars.push({id:'p:amp',name:'성장증폭 %',cat:'소환수',unit:'pct',known:true,pamp:true})
  // 성장증폭 반영 실전투 공격 (앱 계산기와 같은 식): 능력치 4개 + 성장증폭이 있을 때
  if(hasAmp&&pets.some(p=>[0,1,2,3].every(i=>isNum((p.st||[])[i]))))pvars.push({id:'p:ratk',name:'소환수 실전투 공격 (성장증폭 반영)',cat:'소환수',unit:'flat',known:true,preal:true})
  gvars.push(...pvars)
  const mvars=measVars(t)
  // % 는 두 가지로 누적: 더해서(합연산) / 곱해서(곱연산, ×(1+a%)×(1+b%)…)
  // 시작 상태를 적었으면 거기서부터 누적 (실제 총량), 아니면 0 부터 (변화량). '이번만' 변화는 그 기록에만
  const acc={},accC={}

  const s=ses(c.id),o=$('#out');if(!o||!s)return
  const F=(s.findings||[]).filter(f=>f.target===c.target)
  if(!F.length){o.innerHTML='';return}
  o.innerHTML=F.map(f=>`<h2>지난 ${f.kind==='deep'?'심도':'빠른'} 탐색 <span class="mut">${fdate(f.time)} · 기록 ${f.records}개</span></h2>
    <div class="mut">계산에 쓴 것: ${esc(f.inputs.join(', '))}${f.records!==s.records.length?' · <span class="bad">그 뒤로 기록이 바뀌었어요. 다시 찾아 보세요.</span>':''}</div>`+
    f.candidates.map(m=>`<div class="card model${m.rank===1?' best':''}"><div class="big">${m.rank===1?'추천':'후보 '+m.rank} <span class="mut">${esc(m.name)}</span></div>
      <div>${m.exact?'<span class="tag">반올림 안에서 완전 일치</span>':''}${m.testAbs!=null?(m.testExact?'<span class="tag">검증 기록도 맞힘</span>':'<span class="tag bad">검증 기록 어긋남</span>'):''}${m.neg&&m.neg.length?`<span class="tag bad">올리면 줄어듦: ${esc(m.neg.join(', '))}</span>`:''}</div>
      <div class="formula">${esc(m.formula)}</div>
      <div class="row"><span class="mut" style="flex:1">최대 오차 ${fmt(m.maxAbs)} (${fmt(m.maxRel*100,3)}%)</span>${pinBtns(f,m)}</div></div>`).join('')).join('')
  bindPins(c,o)
}
/** 후보 카드의 [복사] [저장] */
function pinBtns(f,m){
  const pin={kind:f.kind,target:f.target,targetName:f.targetName,records:f.records,formula:m.formula,maxAbs:m.maxAbs,exact:m.exact,testAbs:m.testAbs,calc:m.calc||null}
  return`<button class="sm" data-cp="${esc(m.formula)}">복사</button><button class="sm" data-pin="${esc(JSON.stringify(pin))}">저장</button>`
}
function bindPins(c,o){
  o.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copyText(b.dataset.cp))
  o.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const f=JSON.parse(b.dataset.pin)
    mutate(d=>{const x=d.sessions.find(q=>q.id===c.id);if(!x)return;x.saved=x.saved||[]
      if(!x.saved.some(q=>q.formula===f.formula&&q.target===f.target))x.saved.push({id:uid(),time:Date.now(),...f})})
    toast('저장한 공식에 넣었어요.');showSaved(c)})
}
/** 올리면 데미지가 줄어드는 스펙업 항목 이름 (감소형·잴 것 제외). 기록 대부분에서 줄어들면 표시 */
function monoNeg(m,vars,X){const out=[];if(!m||!X||!X.length)return out
  vars.forEach((v,i)=>{if(v.reduce||/^[mc]:/.test(v.id))return
    let neg=0,tot=0
    for(const x of X){const b=m.predict(x);if(!isFinite(b))continue;const z=x.slice(),st=v.unit==='pct'?1:Math.max(1,Math.abs(x[i])*0.01);z[i]+=st
      const a=m.predict(z);if(!isFinite(a))continue;tot++;if(a<b-Math.abs(b)*5e-4)neg++}
    if(tot&&neg>tot/2)out.push(v.name)})
  return out}
/** 모델이 쓰는 변수 id (곱연산 누적은 id 뒤에 *) */
function modelVarIds(m,P){
  const vs=m.vars||P.vars
  return vs.map((x,i)=>x.id.endsWith('*')||!/\(곱\)$/.test(x.name)?x.id:x.id+'*')
}
/** 찾은 후보를 세션에 남긴다 (대상·탐색 종류별 마지막 결과). 내보내기 JSON 에도 들어감 */
function storeResult(c,R){
  const f={kind:R.kind,target:c.target,targetName:R.P.tname,inputs:R.P.vars.map(v=>v.name),records:ses(c.id).records.length,used:R.P.rows.length,time:Date.now(),
    candidates:R.models.map((m,i)=>({rank:i+1,name:R.kind==='deep'?'크기 '+m.size:m.name,formula:(m.tidy||m.formula).replace('결과',R.P.tname),
      maxAbs:m.maxAbs,maxRel:m.maxRel,exact:!!m.exact,testAbs:m.testAbs??null,testExact:m.testExact??null,
      calc:m.spec?{spec:m.spec,p:m.p,vars:modelVarIds(m,R.P)}:null}))}
  // 의심 기록: 추천 공식과의 차이가 허용 오차와 '보통 차이(중앙값)×4' 보다 모두 큰 기록
  const m=R.models[0]
  if(R.dropped&&R.dropped.length)f.suspects=R.dropped.slice()
  else if(m&&!m.exact){
    const X=m.X||R.P.X,res=R.P.rows.map((r,j)=>m.predict(X[j])-R.P.y[j]),a=res.map(Math.abs),med=[...a].sort((p,q)=>p-q)[a.length>>1]
    const unit=roundUnit(R.P.y)
    f.suspects=R.P.rows.filter((r,j)=>a[j]>Math.max(unit,(R.P.tol&&R.P.tol[j])||0)*1.5&&a[j]>med*4).map(r=>r.r.id)
  }else f.suspects=[]
  mutate(d=>{const x=d.sessions.find(q=>q.id===c.id);if(!x)return
    x.findings=(x.findings||[]).filter(q=>!(q.kind===f.kind&&q.target===f.target));x.findings.push(f)})
  R.stored=f
}
/**
 * 빠른 탐색: 두 번 이상 쌓은 % 항목은 합연산 누적/곱연산 누적을 둘 다 넣어 보고 (최대 4개 → 16가지 조합)
 * 모든 결과를 합쳐 잘 맞는 순으로 6개
 */
function quickAll(P){
  // 크게 어긋나는 기록(입력 실수 등)이 공식을 끌어당기지 않게: 하나씩 빼 보며 다시 맞춘다 (최대 기록의 20%)
  let keep=P.rows.map((_,i)=>i);const dropped=[]
  for(;;){
    const sub={...P,rows:keep.map(i=>P.rows[i]),y:keep.map(i=>P.y[i]),tol:P.tol?keep.map(i=>P.tol[i]):null}
    const ms=quickFit(sub,P),m=ms[0]
    if(!m||m.exact||dropped.length>=Math.floor(P.rows.length*0.2)||keep.length<6)return{models:ms,dropped}
    const unit=roundUnit(sub.y),a=m.res.map(Math.abs),med=[...a].sort((p,q)=>p-q)[a.length>>1]
    const j=a.reduce((b,v,i)=>v>a[b]?i:b,0)
    if(!(a[j]>Math.max(unit,(sub.tol&&sub.tol[j])||0)*2&&a[j]>med*6))return{models:ms,dropped}
    dropped.push(keep[j]);keep.splice(j,1)
  }
}
/** 두 번 이상 쌓은 % 는 합연산/곱연산 누적을 둘 다 (최대 4개 → 16가지 조합), 모두 합쳐 잘 맞는 순 6개 */
function quickFit(sub,P){
  const st=P.vars.map((x,i)=>i).filter(i=>P.vars[i].unit==='pct'&&P.vars[i].stack>=2).slice(0,4)
  const all=[]
  for(let mask=0;mask<(1<<st.length);mask++){
    const comp=st.filter((_,b)=>mask&(1<<b))
    const vars=P.vars.map((x,i)=>comp.includes(i)?{...x,name:x.name+'(곱)'}:x)
    const xs=r=>P.vars.map((x,i)=>comp.includes(i)?r.v[x.id+'*']:r.v[x.id])
    for(const m of fitModels(vars,sub.rows.map(xs),sub.y,sub.tol)){if(m.skip)continue
      m.vars=vars;m.X=P.rows.map(xs);m.comp=comp.length   // 표시·예측은 모든 기록으로
      if(comp.length)m.name+=' · 곱연산: '+comp.map(i=>P.vars[i].name).join(', ')
      m.neg=monoNeg(m,vars,m.X);all.push(m)}
  }
  all.sort((a,b)=>(!!a.neg.length-!!b.neg.length)||(b.exact-a.exact)||(a.exact&&b.exact?(a.k-b.k)||(a.comp-b.comp):0)||a.score-b.score)
  // 같은 틀(합연산/곱연산만 다른 것)이 6칸을 다 차지하지 않게: 틀마다 가장 좋은 것 먼저, 남는 칸은 나머지로
  const base=m=>m.name.split(' · ')[0],first=[],rest=[],seenB=new Set()
  for(const m of all)(seenB.has(base(m))?rest:first).push(m),seenB.add(base(m))
  return[...first,...rest].slice(0,6)
}
function runDeep(c,P){
  if(deepRun){deepRun.stop=true;return}
  if(!P.vars.length)return alert('계산에 쓸 것을 하나 이상 골라 주세요.')
  if(P.rows.length<5)return alert('심도 탐색은 기록 5개 이상이 필요해요.')
  if(c.dropped&&c.dropped.length){const keep=P.rows.map((r,i)=>i).filter(i=>!c.dropped.includes(P.rows[i].r.id))
    P={...P,rows:keep.map(i=>P.rows[i]),y:keep.map(i=>P.y[i]),X:keep.map(i=>P.X[i]),tol:P.tol?keep.map(i=>P.tol[i]):null}}
  const extra=P.vars.filter(x=>x.unit==='pct'&&x.stack>=2)
  if(extra.length){P={...P,vars:[...P.vars,...extra.map(x=>({...x,id:x.id+'*',name:x.name+'(곱)'}))]}
    P.X=P.rows.map(r=>P.vars.map(x=>r.v[x.id]))}
  const hold=$('#hold').checked&&P.rows.length>=10,tr=[],te=[]
  P.rows.forEach((_,i)=>(hold&&i%5===4?te:tr).push(i))
  const X=tr.map(i=>P.X[i]),y=tr.map(i=>P.y[i]),Xt=te.map(i=>P.X[i]),yt=te.map(i=>P.y[i])
  const tol=P.tol?tr.map(i=>P.tol[i]):null,tolT=P.tol?te.map(i=>P.tol[i]):null
  const E=gpEngine(P.vars,X,y),secs=+$('#dt').value,t0=Date.now(),run=deepRun={stop:false}
  let lastShow=0
  $('#dp').textContent='정지'
  const out=$('#out')
  out.innerHTML='<div class="card"><div class="big">심도 탐색 중…</div><div class="mut prog"></div><div class="live"></div></div>'
  const finish=()=>{
    if(deepRun===run)deepRun=null
    const models=[]
    for(const e of E.front()){const m=gpModel(e,P.vars,X,y,Xt,yt,false,tol,tolT);m.errN=e.errN;m.neg=monoNeg(m,P.vars,P.X);models.push(m);if(m.exact&&!m.neg.length)break}
    // 추천: 검증 기록까지 맞는 것 중 가장 단순한 것. 없으면 오차·단순함 점수 (검증 기록이 있으면 그 오차도 반영)
    let rec=models.find(m=>m.exact&&m.testExact!==false&&!m.neg.length)
    const sc=m=>Math.log10(Math.max(m.errN,E.floor))+0.035*m.size+(m.testAbs!=null&&!m.testExact?0.5:0)+(m.neg.length?3:0)
    if(!rec)rec=models.reduce((b,m)=>!b||sc(m)<sc(b)?m:b,null)
    const others=models.filter(m=>m!==rec).reverse().slice(0,5)
    c.res={kind:'deep',P,models:rec?[rec,...others]:[],test:te.length,checked:E.step(0).checked,secs:Math.round((Date.now()-t0)/1000)}
    if(c.res.models.length)storeResult(c,c.res)
    if(document.body.contains(out)){$('#dp').textContent='심도 탐색';showRes(c)}
  }
  const tick=()=>{
    if(run.stop||Date.now()-t0>secs*1000)return finish()
    const st=E.step(40)
    if(Date.now()-lastShow>800){lastShow=Date.now()
      out.querySelector('.prog').textContent=`${Math.max(0,Math.ceil(secs-(Date.now()-t0)/1000))}초 남음 · 공식 ${st.checked.toLocaleString()}개 확인 · ${st.gen}세대`
      out.querySelector('.live').innerHTML=E.front().slice(-3).reverse().map(e=>{const m=gpModel(e,P.vars,X,y,null,null,true)
        return`<div class="formula">${m.exact?'✔ ':''}${esc(m.formula.replace('결과',P.tname))}<div class="mut">최대 오차 ${fmt(m.maxAbs)}</div></div>`}).join('')}
    setTimeout(tick,1)
  }
  tick()
}
function showRes(c){

  if(!R.models.length){o.innerHTML='<div class="card empty">맞는 공식을 못 찾았어요. 기록을 더 모으거나 시간을 늘려 보세요.</div>';return}
  const best=R.models[0]
  const head=R.kind==='manual'?`<h2>직접 적은 공식 <span class="mut">기록 ${P.rows.length}개와 비교</span></h2>`:R.kind==='quick'?`<h2>빠른 탐색 결과 <span class="mut">오차 적은 순</span></h2>`
    :`<h2>심도 탐색 결과 <span class="mut">${R.secs}초 · ${R.checked.toLocaleString()}개 확인${R.test?` · 검증용 ${R.test}개`:''}</span></h2>`
  const sus=R.stored&&R.stored.suspects||[]

  const hint=(R.hints||[]).concat(P.wild&&P.wild.length?[`⚠ 흔들림이 너무 큰 기록 #${P.wild.join(', #')}: 같은 칸에 다른 숫자가 섞였을 수 있어요 (예: '1억 4688만'이 두 숫자로). [기록]에서 고치거나 빼 주세요.`]:[])
    .concat(best.neg&&best.neg.length?[`추천 공식도 '${best.neg.join(', ')}'을(를) 올리면 데미지가 줄어드는 모양이라 맞지 않아요. 기록을 더 모아 주세요.`]:[]).concat(best.exact?[]:['기록과 딱 맞는 공식은 아직 없어요. 기록을 더 모으거나, 심도 탐색 시간을 늘려 다시 찾아 보세요.'])
    .concat(susNo.length&&!(R.dropped&&R.dropped.length)?[`⚠ 의심 기록 ${susNo.join(', ')}: 추천 공식과 크게 어긋나요. [기록]에서 입력 실수인지 확인하고, 고치거나 [빼기] 후 다시 찾아 보세요.`]:[])
  o.innerHTML=head+(hint.length?`<div class="card"><div class="big">다음에 할 것</div><ul class="hints">${hint.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>`:'')+
    R.models.map((m,i)=>`<div class="card model${i===0?' best':''}">
      <div class="big">${i===0?'추천':'후보 '+(i+1)} <span class="mut">${esc(R.kind==='deep'?'크기 '+m.size:m.name)}</span></div>
      <div>${m.exact?`<span class="tag">${P.tol?'흔들림 범위 안에서 일치':'반올림 안에서 완전 일치'}</span>`:''}${m.testAbs!=null?(m.testExact?'<span class="tag">검증 기록도 맞힘</span>':'<span class="tag bad">검증 기록 어긋남</span>'):''}${m.neg&&m.neg.length?`<span class="tag bad">올리면 줄어듦: ${esc(m.neg.join(', '))}</span>`:''}</div>
      <div class="formula">${esc((m.tidy||m.formula).replace('결과',P.tname))}</div>
      ${i===0?(()=>{const sx=ses(c.id),tt=sx&&tpl(sx.templateId),mm=tt&&tt.measures.find(q=>q.id===(c.target||'').slice(2)),bp=num(mm&&(mm.basePct??mm.pct))
        return isFinite(bp)&&bp!==100?`<div class="mut">잰 공격이 ${fmt(bp)}%라서, 1배(100%) 기준 한 방은 이 값 ÷ ${fmt(bp/100,4)} 이에요. 최적화는 이 1배 기준으로 계산해요.</div>`:''})():''}
      ${i===0?influenceCard(m,R,c):''}
      <div class="row"><div class="mut" style="flex:1">최대 오차 <b class="${m.exact?'good':m.maxRel>0.01?'bad':''}">${fmt(m.maxAbs)} (${fmt(m.maxRel*100,3)}%)</b>${m.testAbs!=null?` · 검증 최대 오차 <b class="${m.testExact?'good':'bad'}">${fmt(m.testAbs)}</b>`:''}</div>
        ${R.stored?pinBtns(R.stored,R.stored.candidates[i]):''}</div>
      ${m.tidy?`<details><summary>정리 전 계수</summary><div class="formula">${esc(m.formula.replace('결과',P.tname))}</div></details>`:''}
      <details${i===0?'':''}><summary>기록별 예측</summary><div class="scroll"><table><tr><th class="l">#</th><th>실제</th><th>예측</th><th>차이</th></tr>
        ${P.rows.map((r,j)=>{const pr=m.predict((m.X||P.X)[j]),d=pr-P.y[j],out=(R.dropped||[]).includes(r.r.id);return`<tr class="${Math.abs(d)>Math.max(roundUnit(P.y),(P.tol&&P.tol[j])||0)*1.0000001+1e-9?'worst':''}"><td class="l">${out?'⚠':''}${r.no}</td><td>${fmt(P.y[j])}</td><td>${fmt(pr)}</td><td>${fmt(d)}</td></tr>`}).join('')}
      </table></div></details>

  o.querySelectorAll('[data-graph]').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)drawGraphs(d.querySelector('.gbox'),R.models[+d.dataset.graph],R)}))
  bindPins(c,o)

// ---------------------------------------------------------------- 최적화: 저장한 공식으로 내 상태 → 바꿔 보기 → 최적 셋팅
/** 공식 대상 id (예전 기록은 잴 것 id 만 있음 → 일반) */
const normT=t=>t&&t.includes(':')?t:'m:'+t
/** 최적화에 쓸 수 있는 공식: 저장한 공식 + 지난 탐색의 추천 */
function optFormulas(s){
  // 같은 틀을 쓰는 세션끼리는 변수(분류·항목)가 같아서 공식을 같이 쓸 수 있다
  const L=[]
  for(const x of [s,...data.sessions.filter(q=>q!==s&&q.templateId===s.templateId)]){
    const pre=x===s?'':`[${x.name}] `
    for(const f of x.saved||[])if(f.calc)L.push({key:f.id,label:pre+'저장: '+f.formula,f:{...f.calc,target:f.target,targetName:f.targetName,formula:f.formula}})
    for(const f of x.findings||[]){const m=f.candidates[0];if(m&&m.calc)L.push({key:'find:'+x.id+':'+f.kind+':'+f.target,label:pre+`지난 ${f.kind==='deep'?'심도':'빠른'} 탐색 추천: `+m.formula,f:{...m.calc,target:f.target,targetName:f.targetName,formula:m.formula}})}
  }
  return L
}
/** 숫자나 식 ([이름] 으로 다른 값 참조). 못 읽으면 NaN */
function exprVal(expr,st,names){
  if(expr==null||String(expr).trim()==='')return NaN
  const js=String(expr).replace(/\[([^\]]+)\]/g,(_,n)=>{const id=names[n.trim()];return id?`(${+(st[id]||0)})`:'0'})
  if(/[^0-9+\-*/().\s]/.test(js))return NaN
  try{const v=Function('return ('+js+')')();return isFinite(v)?v:NaN}catch(e){return NaN}
}
/** 변수 상태에 변경 하나 적용 (% 는 곱연산 누적값 id* 도 같이) */
function applyChange(st,vid,op,val,pct){
  const v=st[vid]||0,cv=st[vid+'*']??v
  if(op==='='){st[vid]=val;if(pct)st[vid+'*']=val;return}
  const d=op==='-'?-val:val
  st[vid]=v+d
  if(pct)st[vid+'*']=op==='-'?((1+cv/100)/(1+val/100)-1)*100:((1+cv/100)*(1+val/100)-1)*100
}
/** 특수 효과 규칙: 대상 += 식 ([이름] 으로 다른 값 참조) */
function applyRules(st,rules,names){
  for(const r of rules||[]){
    if(!r.target||!r.expr)continue
    const val=exprVal(r.expr,st,names)
    if(isFinite(val))applyChange(st,r.target,r.op||'+',val,r.pct)
  }
  return st
}
/** 게임의 공식들: 그 게임 실험들의 [저장] 공식 (+ 지난 탐색 추천) */
function gameFL(t){const L=[]
